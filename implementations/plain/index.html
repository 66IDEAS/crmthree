    /** Button with a leading inline icon; no emoji anywhere outside gamification. */
    function iconBtn(icon, label, cls = 'btn-sm') {
      const b = h('button', { class: cls });
      b.innerHTML = `${ICONS[icon] || ''}<span>${label}</span>`;
      return b;
    }

    const NAV_ICON = {
      Account: 'account', Contact: 'contact', Lead: 'lead', Opportunity: 'opp',
      DealRoom: 'dealRoom', Quotation: 'quote', SalesOrder: 'order', Invoice: 'invoice',
      Product: 'product', Activity: 'activity', Ticket: 'ticket', CaseRoom: 'caseRoom',
      KnowledgeArticle: 'knowledge', Asset: 'asset', SLA: 'sla', ServiceContract: 'contract'
    };
    const NAV_ITEMS = [
      { id: 'home', label: 'Home', icon: 'home' },
      ...REG.nav.map(([id, label]) => ({ id, label, icon: NAV_ICON[id] || 'product' }))
    ];
    function navLabel(item) { return item.id === 'home' ? t('nav.home', 'Home') : objLabel(item.id); }

    // --- State & Router (Phase 1 & Phase 2 UI) ---
    const state = {
      currentView: 'home',
      currentParams: {},
      history: [{ name: 'Home', view: 'home' }],
      ribbonExpanded: false,
      theme: 'light',
      listPagination: { page: 1, pageSize: 25, sortBy: null, sortDir: 'asc', search: '' }
    };

    function setTheme(t) {
      state.theme = t;
      document.documentElement.setAttribute('data-theme', t);
      const cfg = DB._raw(`${PREFIX}cfg`) || {};
      cfg.theme = t;
      DB._setRaw(`${PREFIX}cfg`, cfg);
    }

    function toggleTheme() {
      setTheme(state.theme === 'dark' ? 'light' : 'dark');
    }

    function navigate(view, params = {}, label = null) {
      state.currentView = view;
      state.currentParams = params;
      
      const name = label || (NAV_ITEMS.find(n => n.id === view)?.label || view);
      state.history.push({ name, view, params });
      if (state.history.length > 5) state.history.shift();

      renderBreadcrumbs();
      renderRibbon();
      renderView();

      $('#left-ribbon')?.classList.remove('mobile-open');
      $('#ribbon-backdrop')?.classList.remove('mobile-open');
    }

    function renderBreadcrumbs() {
      const bar = $('#breadcrumbs-bar');
      if (!bar) return;
      bar.innerHTML = '';
      state.history.forEach((item, idx) => {
        if (idx > 0) bar.appendChild(document.createTextNode(' / '));
        if (idx === state.history.length - 1) {
          bar.appendChild(h('span', { class: 'current' }, item.name));
        } else {
          const a = h('a', { href: '#' }, item.name);
          a.onclick = (e) => { e.preventDefault(); navigate(item.view, item.params, item.name); };
          bar.appendChild(a);
        }
      });
    }

    function renderRibbon() {
      const nav = $('#ribbon-nav-list');
      if (!nav) return;
      nav.innerHTML = '';

      NAV_ITEMS.forEach(item => {
        const row = h('div', {
          class: `ribbon-item ${state.currentView === item.id ? 'active' : ''}`,
          title: navLabel(item)
        });
        row.innerHTML = `${ICONS[item.icon] || ''}<span class="ribbon-label">${navLabel(item)}</span>`;
        row.onclick = () => {
          state.listPagination = { page: 1, pageSize: 25, sortBy: null, sortDir: 'asc', search: '' };
          navigate(item.id);
        };
        nav.appendChild(row);
      });

      nav.appendChild(h('div', { class: 'ribbon-divider' }));
      const settingsRow = h('div', {
        class: `ribbon-item ${state.currentView === 'settings' ? 'active' : ''}`,
        title: 'Settings'
      });
      settingsRow.innerHTML = `${ICONS.settings}<span class="ribbon-label">${t('nav.settings', 'Settings')}</span>`;
      settingsRow.onclick = () => navigate('settings', {}, 'Settings');
      nav.appendChild(settingsRow);
    }

    /**
     * P11: reference fields use a type-ahead picker, not a select - a select is unusable at
     * hundreds or thousands of records. Keeps a hidden input so FormData still sees the id.
     * P12: `filter` narrows the candidate list (contacts of the chosen account, for example)
     * and is evaluated on every open, so it follows the other field's current value.
     */
    function refPicker(f, currentVal, filter, onPick) {
      const wrap = h('div', { class: 'ref-pick' });
      const hidden = h('input', { type: 'hidden', name: f.k, value: currentVal || '' });
      const targetMeta = M(f.refTbl) || {};
      const numField = targetMeta.numField;
      const label = (rec) => getDisplayName(f.refTbl, rec);
      // Searchable beyond the name: every plain-text column the object's own list view shows,
      // so a contact is findable by email, an account by city, a product by its group.
      const hintCols = (targetMeta.cols || [])
        .filter(c => c.k !== numField && !c.refTbl && ['string', 'text'].includes(c.type))
        .map(c => c.k)
        .filter(k => !['name', 'name1', 'first_name', 'last_name', 'subject', 'title', 'label'].includes(k));
      const hintOf = (r) => { for (const k of hintCols) if (r[k]) return String(r[k]); return ''; };
      const input = h('input', {
        class: 'form-control', autocomplete: 'off',
        placeholder: `${t('ui.search', 'Search…')} ${objSingular(f.refTbl)}`,
        value: currentVal ? label(DB.getById(f.refTbl, currentVal) || {}) : ''
      });
      const drop = h('div', { class: 'ref-drop' });
      // Opens below the field, flips above when that is roomier, and always stays inside the
      // viewport: the list shrinks rather than being cut off.
      const place = () => {
        const r = input.getBoundingClientRect();
        const w = Math.max(r.width, 240);
        drop.style.width = w + 'px';
        drop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
        const below = window.innerHeight - r.bottom - 8;
        const above = r.top - 8;
        const flip = below < 160 && above > below;
        drop.style.maxHeight = Math.max(120, Math.min(260, flip ? above : below)) + 'px';
        if (flip) {
          drop.style.top = '';
          drop.style.bottom = Math.max(8, window.innerHeight - r.top + 4) + 'px';
        } else {
          drop.style.bottom = '';
          drop.style.top = Math.max(8, Math.min(r.bottom + 4, window.innerHeight - 128)) + 'px';
        }
      };
      const openDrop = () => {
        if (drop.parentNode !== document.body) document.body.appendChild(drop);
        drop.classList.add('open');
        place();
        window.addEventListener('scroll', place, true);
        window.addEventListener('resize', place);
      };
      const closeDrop = () => {
        drop.classList.remove('open');
        window.removeEventListener('scroll', place, true);
        window.removeEventListener('resize', place);
        if (drop.parentNode) drop.parentNode.removeChild(drop);
      };
      const clear = h('span', { class: 'ref-clear', title: t('ui.remove', 'Remove') }, '✕');
      clear.style.display = currentVal ? '' : 'none';
      clear.onmousedown = (e) => {
        e.preventDefault();
        hidden.value = ''; input.value = ''; clear.style.display = 'none';
        if (onPick) onPick(null);
      };
      let idx = -1, shown = [];
      const paint = (q) => {
        let rows = DB.list(f.refTbl);
        if (filter) { try { rows = rows.filter(filter); } catch (e) { /* keep all */ } }
        const needle = (q || '').toLowerCase().trim();
        if (needle) rows = rows.filter(r => label(r).toLowerCase().includes(needle) ||
          (numField && String(r[numField] || '').replace(/^0+/, '').includes(needle)) ||
          hintCols.some(k => String(r[k] || '').toLowerCase().includes(needle)));
        shown = rows.slice(0, 50);
        drop.innerHTML = '';
        if (!shown.length) { drop.appendChild(h('div', { class: 'ref-empty' }, t('search.no_results', 'No results found'))); place(); return; }
        shown.forEach((r, i) => {
          const opt = h('div', { class: 'ref-opt' + (i === idx ? ' sel' : '') });
          const hint = hintOf(r);
          opt.innerHTML = `<span>${label(r)}</span>${hint ? `<span class="n">${hint}</span>` : ''}` +
            `${numField && r[numField] ? `<span class="n" style="margin-left:auto">#${DB.formatNumber(r[numField])}</span>` : ''}`;
          opt.onmousedown = (e) => { e.preventDefault(); pick(r); };
          drop.appendChild(opt);
        });
        if (rows.length > shown.length) drop.appendChild(h('div', { class: 'ref-empty' }, `+${rows.length - shown.length} more - keep typing`));
        place();
      };
      const pick = (r) => {
        hidden.value = r.id; input.value = label(r); clear.style.display = '';
        closeDrop(); idx = -1;
        wrap.classList.remove('missing');
        if (onPick) onPick(r);
      };
      input.onfocus = () => { idx = -1; paint(''); input.select(); openDrop(); };
      input.oninput = () => { idx = -1; hidden.value = ''; clear.style.display = 'none'; paint(input.value); openDrop(); };
      input.onblur = () => setTimeout(() => {
        closeDrop();
        // A half-typed name that matched nothing must not look selected.
        if (!hidden.value) input.value = '';
      }, 120);
      input.onkeydown = (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          idx = Math.max(0, Math.min(shown.length - 1, idx + (e.key === 'ArrowDown' ? 1 : -1)));
          paint(input.value);
          place();
          drop.children[idx] && drop.children[idx].scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter') {
          if (drop.classList.contains('open') && shown[idx < 0 ? 0 : idx]) { e.preventDefault(); pick(shown[idx < 0 ? 0 : idx]); }
        } else if (e.key === 'Escape') { closeDrop(); }
      };
      wrap.appendChild(input); wrap.appendChild(clear); wrap.appendChild(hidden);
      return wrap;
    }

    /** P12: contacts follow the account chosen in the same form. */
    function dependentFilter(f, formEl) {
      if (f.refTbl !== 'Contact' || !formEl) return null;
      return (c) => {
        const acc = formEl.querySelector('input[name="account_id"]');
        const accId = acc && acc.value;
        return !accId || c.account_id === accId;
      };
    }

    function buildInput(f, currentVal, formEl) {
      let input;
      const val = currentVal ?? '';
      if (f.type === 'enum') {
        input = h('select', { class: 'form-control', name: f.k });
        if (!f.req) input.appendChild(h('option', { value: '' }, '—'));
        (f.opts || []).forEach(opt => {
          const o = h('option', { value: opt }, enumLabel(opt));
          if (opt === val) o.selected = true;
          input.appendChild(o);
        });
      } else if (f.refTbl) {
        input = refPicker(f, val, dependentFilter(f, formEl));
      } else if (f.type === 'textarea' || f.type === 'text') {
        input = h('textarea', { class: 'form-control', name: f.k }, val);
      } else if (f.type === 'boolean') {
        input = h('select', { class: 'form-control', name: f.k });
        [['', '—'], ['true', t('ui.yes', 'Yes')], ['false', t('ui.no', 'No')]].forEach(([v, lbl]) => {
          const o = h('option', { value: v }, lbl);
          if (String(val) === v) o.selected = true;
          input.appendChild(o);
        });
      } else if (f.type === 'date') {
        input = h('input', { type: 'date', class: 'form-control', name: f.k, value: String(val).slice(0, 10) });
      } else if (f.type === 'datetime') {
        input = h('input', { type: 'datetime-local', class: 'form-control', name: f.k, value: String(val).slice(0, 16) });
      } else if (['number', 'integer', 'decimal', 'currency'].includes(f.type)) {
        input = h('input', { type: 'number', step: f.type === 'integer' ? '1' : 'any', class: 'form-control', name: f.k, value: val });
      } else {
        input = h('input', { type: 'text', class: 'form-control', name: f.k, value: val, ...(f.len ? { maxlength: f.len } : {}) });
      }
      return input;
    }
    function formFields(meta) { return meta.fields.filter(f => !f.auto && f.type !== 'json'); }
    function collectForm(tbl, meta, form) {
      const fd = new FormData(form);
      const data = {};
      for (const f of formFields(meta)) {
        let val = fd.get(f.k);
        if (f.req && (!val || !String(val).trim())) {
          alert(`${fieldLabel(tbl, f)} ${t('form.required_suffix', 'is required.')}`);
          return null;
        }
        if (val === '' || val === null) { data[f.k] = null; continue; }
        if (['number', 'integer', 'decimal', 'currency'].includes(f.type)) val = Number(val);
        if (f.type === 'boolean') val = val === 'true';
        data[f.k] = val;
      }
      return data;
    }

    // --- T2.5: Client-Side CSV Export ---
    function exportCSV(tbl) {
      const rows = DB.list(tbl);
      if (!rows.length) {
        alert(`No records in ${tbl} to export.`);
        return;
      }
      const meta = M(tbl);
      const cols = meta ? meta.cols : Object.keys(rows[0]).map(k => ({ k, l: k }));
      const headers = cols.map(c => `"${c.l.replace(/"/g, '""')}"`).join(',');
      const lines = rows.map(r => {
        return cols.map(c => {
          let val = r[c.k];
          if (c.k === '_name') val = getDisplayName(tbl, r);
          else if (c.k === meta?.numField) val = DB.formatNumber(val);
          else if (val === null || val === undefined) val = '';
          return `"${String(val).replace(/"/g, '""')}"`;
        }).join(',');
      });

      const csvContent = [headers, ...lines].join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${tbl.toLowerCase()}_export.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // --- Phase 2: Main View Router Dispatcher ---
    function renderView() {
      const mount = $('#view-mount');
      const title = $('#page-title');
      const actions = $('#page-actions');
      if (!mount || !title || !actions) return;

      actions.innerHTML = '';
      mount.innerHTML = '';

      const view = state.currentView;
      const params = state.currentParams || {};

      if (view === 'home') {
        renderHome();
      } else if (view === 'settings') {
        renderSettingsView();
      } else if (view === 'DealRoom' && params.id) {
        renderDealRoom(params.id);
      } else if (view === 'CaseRoom' && params.id) {
        renderCaseRoom(params.id);
      } else if (view === 'Leaderboard') {
        renderLeaderboard();
      } else if (view === 'Profile') {
        renderProfile();
      } else if (view === 'login') {
        renderLoginView();
      } else if (view === 'MyTimeline') {
        renderTimeline(false);
      } else if (view === 'TeamTimeline') {
        renderTimeline(true);
      } else if (M(view)) {
        // Domain Entity View: Route between list, detail, and create forms
        if (params.mode === 'create') {
          renderCreateView(view, params.prefill || {});
        } else if (params.id) {
          renderDetailView(view, params.id, params.mode || 'view');
        } else {
          renderListView(view);
        }
      } else {
        title.textContent = view;
        mount.innerHTML = `<div class="card"><p>View <strong>${view}</strong></p></div>`;
      }
    }

    // --- T2.1: Table-Based List View ---
    function renderListView(tbl) {
      const title = $('#page-title');
      const actions = $('#page-actions');
      // Views re-render themselves (filter, sort, paging, mode switches), so each renderer
      // clears its own mount; relying on the router to do it stacked duplicate copies.
      const mount = $('#view-mount');
      mount.innerHTML = '';
      const navItem = NAV_ITEMS.find(n => n.id === tbl);
      title.textContent = navItem ? navItem.label : tbl;

      // Header actions: Export CSV + New Button
      actions.innerHTML = '';
      const exportBtn = h('button', { class: 'btn-sm' });
      exportBtn.innerHTML = `${ICONS.download} ${t('ui.export_csv', 'Export CSV')}`;
      exportBtn.onclick = () => exportCSV(tbl);
      actions.appendChild(exportBtn);

      if (tbl === 'Lead' && AI.ready()) {
        const mailBtn = iconBtn('sparkle', 'New from Email');
        mailBtn.style.cssText = 'border-color:var(--accent); color:var(--accent)';
        mailBtn.onclick = () => newLeadFromEmail();
        actions.appendChild(mailBtn);
      }
      dataSourceRefresh(tbl);
      const newBtn = h('button', { class: 'btn-primary btn-sm' }, `+ ${t('ui.new', 'New')} ${objSingular(tbl)}`);
      newBtn.onclick = () => navigate(tbl, { mode: 'create' }, `${t('ui.new', 'New')} ${objSingular(tbl)}`);
      actions.appendChild(newBtn);

      const meta = M(tbl);
      const cfg = DB._raw(`${PREFIX}cfg`) || {};
      const defSort = cfg.listSort?.[tbl] || { sortBy: meta.numField || 'created_at', sortDir: 'asc' };
      
      const p = state.listPagination;
      if (!p.sortBy) {
        p.sortBy = defSort.sortBy;
        p.sortDir = defSort.sortDir;
      }

      // CaseRoom lists Tickets
      const queryTbl = tbl === 'CaseRoom' ? 'Ticket' : tbl;
      const res = DB.query(queryTbl, {
        page: p.page,
        pageSize: p.pageSize,
        sortBy: p.sortBy,
        sortDir: p.sortDir,
        search: p.search
      });

      const tableCard = h('div', { class: 'table-card' });

      // Table Toolbar
      const toolbar = h('div', { class: 'table-toolbar' });
      const searchBox = h('input', {
        type: 'text',
        class: 'form-control',
        style: 'max-width:260px',
        placeholder: `Filter ${navItem?.label || tbl}...`,
        value: p.search
      });
      let debTimer;
      searchBox.oninput = () => {
        clearTimeout(debTimer);
        debTimer = setTimeout(() => {
          p.search = searchBox.value;
          p.page = 1;
          renderListView(tbl);
        }, 200);
      };
      toolbar.appendChild(searchBox);

      const countBadge = h('span', { class: 'chip' }, `${res.totalCount} total`);
      toolbar.appendChild(countBadge);
      tableCard.appendChild(toolbar);

      // Data Table
      const table = h('table', { class: 'data-table' });
      const thead = h('thead');
      const headerRow = h('tr');

      meta.cols.forEach(c => {
        const isSorted = p.sortBy === c.k;
        const sortIndicator = isSorted ? (p.sortDir === 'asc' ? ' ▲' : ' ▼') : '';
        const th = h('th', {}, t(`field.${tbl === 'CaseRoom' ? 'Ticket' : tbl}.${c.k}`, c.l) + sortIndicator);
        th.onclick = () => {
          if (p.sortBy === c.k) {
            p.sortDir = p.sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            p.sortBy = c.k;
            p.sortDir = 'asc';
          }
          renderListView(tbl);
        };
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = h('tbody');
      if (res.data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${meta.cols.length}" style="text-align:center; padding:30px; color:var(--text-muted)">No records found. Click "+ New" above to create one.</td></tr>`;
      } else {
        res.data.forEach(row => {
          const tr = h('tr');
          meta.cols.forEach(c => {
            const td = h('td');
            let val = row[c.k];

            if (c.k === meta.numField) {
              td.innerHTML = `<strong>${DB.formatNumber(val)}</strong>`;
            } else if (c.chip && c.refTbl) {
              td.innerHTML = val ? renderChip(refName(c.refTbl, val)) : '—';
            } else if (c.chip) {
              td.innerHTML = val ? renderChip(val) : '—';
            } else {
              td.textContent = fmtVal(c, val, row);
            }
            tr.appendChild(td);
          });
          tr.onclick = () => navigate(tbl, { id: row.id, mode: 'view' }, getDisplayName(tbl === 'CaseRoom' ? 'Ticket' : tbl, row));
          tbody.appendChild(tr);
        });
      }
      table.appendChild(tbody);
      tableCard.appendChild(table);

      // Pagination Controls
      const paginationBar = h('div', { class: 'pagination-bar' });
      const from = res.totalCount === 0 ? 0 : (res.page - 1) * res.pageSize + 1;
      const to = Math.min(res.page * res.pageSize, res.totalCount);
      paginationBar.appendChild(h('span', {}, `Showing ${from}–${to} of ${res.totalCount} records`));

      const pgBtns = h('div', { class: 'pagination-btns' });
      const prevBtn = h('button', { class: 'btn-sm', disabled: res.page <= 1 }, '◀ Previous');
      prevBtn.onclick = () => { p.page--; renderListView(tbl); };
      pgBtns.appendChild(prevBtn);

      pgBtns.appendChild(h('span', { style: 'font-weight:600; padding:0 6px;' }, `Page ${res.page} of ${res.totalPages}`));

      const nextBtn = h('button', { class: 'btn-sm', disabled: res.page >= res.totalPages }, 'Next ▶');
      nextBtn.onclick = () => { p.page++; renderListView(tbl); };
      pgBtns.appendChild(nextBtn);

      const pageSizeSelect = h('select', { class: 'form-control', style: 'padding:3px 6px; font-size:12px;' });
      [25, 50, 100].forEach(size => {
        const opt = h('option', { value: size }, `${size} / page`);
        if (size === p.pageSize) opt.selected = true;
        pageSizeSelect.appendChild(opt);
      });
      pageSizeSelect.onchange = () => {
        p.pageSize = parseInt(pageSizeSelect.value, 10);
        p.page = 1;
        renderListView(tbl);
      };
      pgBtns.appendChild(pageSizeSelect);

      paginationBar.appendChild(pgBtns);
      tableCard.appendChild(paginationBar);

      mount.appendChild(tableCard);
    }

    // --- T2.2: Record Detail View & Progressive Disclosure Card ---
    function renderDetailView(tbl, id, mode = 'view') {
      const title = $('#page-title');
      const actions = $('#page-actions');
      const mount = $('#view-mount');
      mount.innerHTML = '';
      const record = DB.getById(tbl, id);
      const meta = M(tbl);

      if (!record || !meta) {
        title.textContent = 'Record Not Found';
        mount.innerHTML = `<div class="card"><p>The requested ${tbl} record does not exist.</p><button class="btn-primary" onclick="window.CRM.navigate('${tbl}')">Return to List</button></div>`;
        return;
      }

      const displayName = getDisplayName(tbl, record);
      const autoNum = meta.numField ? DB.formatNumber(record[meta.numField]) : '';

      title.innerHTML = `
        <button class="icon-btn" id="btn-detail-back" title="Back to list" style="padding:4px">
          ${ICONS.back}
        </button>
        <span>${displayName}</span>
        ${autoNum ? `<span class="chip chip-accent">#${autoNum}</span>` : ''}
      `;
      $('#btn-detail-back').onclick = () => navigate(tbl);

      actions.innerHTML = '';
      const lock = getLock(tbl, id);
      const lockedByOther = lock && lock.tab !== TAB_ID;
      if (mode === 'view') {
        if (lockedByOther) {
          actions.appendChild(h('span', { class: 'lock-note' }, `🔒 ${lock.name} is editing`));
        }
        const editBtn = iconBtn('edit', t('ui.edit', 'Edit'));
        if (lockedByOther) editBtn.disabled = true;
        editBtn.onclick = () => {
          if (!acquireLock(tbl, id)) { renderView(); return; }
          renderDetailView(tbl, id, 'edit');
        };
        actions.appendChild(editBtn);

        const delBtn = iconBtn('trash', t('ui.delete', 'Delete'), 'btn-danger btn-sm');
        if (lockedByOther) delBtn.disabled = true;
        delBtn.onclick = () => {
          if (confirm(`Are you sure you want to delete ${displayName}?`)) {
            DB.remove(tbl, id);
            navigate(tbl);
          }
        };
        actions.appendChild(delBtn);
      } else {
        const cancelBtn = h('button', { class: 'btn-sm' }, t('ui.cancel', 'Cancel'));
        cancelBtn.onclick = () => { releaseLock(tbl, id); renderDetailView(tbl, id, 'view'); };
        actions.appendChild(cancelBtn);
      }

      const detailCard = h('div', { class: 'detail-card' });

      if (mode === 'view') {
        // Progressive Disclosure: only non-empty fields
        const grid = h('div', { class: 'detail-grid' });
        let visibleCount = 0;

        meta.fields.forEach(f => {
          const val = record[f.k];
          if (val === null || val === undefined || val === '') return;
          visibleCount++;

          const item = h('div', { class: 'field-item' });
          item.appendChild(h('div', { class: 'field-label' }, fieldLabel(tbl, f)));

          const valEl = h('div', { class: 'field-val' });
          if (f.type === 'enum') valEl.innerHTML = renderChip(val);
          else if (f.type === 'text') { valEl.className = 'field-val md'; valEl.innerHTML = mdToHtml(val); }
          else valEl.textContent = fmtVal(f, val, record);
          item.appendChild(valEl);
          grid.appendChild(item);
        });

        if (visibleCount === 0) {
          grid.innerHTML = '<p style="color:var(--text-muted)">No detailed fields entered yet. Click "Edit" above to fill in record details.</p>';
        }
        mount.appendChild(quickActionBar(tbl, id, record));
        if (['Account', 'Contact', 'Lead', 'Opportunity', 'Ticket'].includes(tbl)) {
          mount.appendChild(aiBriefingCard(tbl, id, record));
        }
        detailCard.appendChild(grid);
        mount.appendChild(detailCard);
        if (LINE_PARENTS.includes(tbl)) mount.appendChild(lineItemCard(tbl, id));

        // --- T2.4: Render Linked Records Cards ---
        if (meta.linked && meta.linked.length > 0) {
          // The dedicated line-item editor above already shows this relationship, richer and
          // editable; the generic card would be a read-only duplicate of the same rows.
          const cards = meta.linked.filter(link => !(link.t === 'LineItem' && LINE_PARENTS.includes(tbl)));
          cards.forEach(link => {
            const linkedCard = h('div', { class: 'linked-card' });
            const relatedRecords = DB.query(link.t, { filter: r => link.m
              ? DB.list(link.m).some(j => j[link.a] === id && j[link.b] === r.id)
              : (r[link.k] === id && (!link.w || r[link.w.f] === link.w.v)) }).data;

            const lHeader = h('div', { class: 'linked-header' });
            lHeader.appendChild(h('span', {}, `${link.l} (${relatedRecords.length})`));

            if (link.m) {
              const linkBtn = iconBtn('link', t('ui.link', 'Link'));
              linkBtn.onclick = () => {
                const already = new Set(DB.list(link.m).filter(j => j[link.a] === id).map(j => j[link.b]));
                const picker = refPicker({ k: '_pick', refTbl: link.t }, '', (r) => !already.has(r.id));
                const bodyEl = h('div', {});
                bodyEl.appendChild(h('div', { class: 'form-label' }, objSingular(link.t)));
                bodyEl.appendChild(picker);
                const cancel = h('button', {}, t('ui.cancel', 'Cancel'));
                const go = h('button', { class: 'btn-primary' }, t('ui.link', 'Link'));
                const dlg = openDlg(`${t('ui.link', 'Link')} ${objSingular(link.t)}`, bodyEl, [cancel, go]);
                cancel.onclick = () => dlg.close();
                go.onclick = () => {
                  const chosen = picker.querySelector('input[type=hidden]').value;
                  if (!chosen) return;
                  DB.create(link.m, { [link.a]: id, [link.b]: chosen });
                  dlg.close(); renderView();
                };
              };
              lHeader.appendChild(linkBtn);
            }
            const addRelatedBtn = h('button', { class: 'btn-sm' }, `+ ${t('ui.add', 'Add')}`);
            addRelatedBtn.onclick = () => {
              const prefill = link.m ? {} : { [link.k]: id, ...(link.w ? { [link.w.f]: link.w.v } : {}) };
              navigate(link.t, { mode: 'create', prefill }, `${t('ui.new', 'New')} ${objSingular(link.t)}`);
            };
            lHeader.appendChild(addRelatedBtn);
            linkedCard.appendChild(lHeader);

            if (relatedRecords.length === 0) {
              linkedCard.appendChild(h('div', { style: 'padding:16px; color:var(--text-muted); font-size:13px;' }, t('misc.no_linked_records', 'No linked records.')));
            } else {
              const relTable = h('table', { class: 'data-table' });
              const relDef = M(link.t);
              const relCols = relDef ? relDef.cols.slice(0, 4) : [{ k: 'id', l: 'ID' }];
              const thead = h('thead');
              const hRow = h('tr');
              relCols.forEach(c => hRow.appendChild(h('th', {}, c.l)));
              thead.appendChild(hRow);
              relTable.appendChild(thead);

              const tbody = h('tbody');
              relatedRecords.forEach(r => {
                const tr = h('tr');
                relCols.forEach(c => {
                  const td = h('td');
                  if (c.k === relDef?.numField) td.innerHTML = `<strong>${DB.formatNumber(r[c.k])}</strong>`;
                  else if (c.refTbl) td.textContent = refName(c.refTbl, r[c.k]);
                  else if (c.chip) td.innerHTML = renderChip(r[c.k]);
                  else td.textContent = r[c.k] || '—';
                  tr.appendChild(td);
                });
                if (link.m) {
                  const td = h('td', { style: 'text-align:right' });
                  const un = h('button', { class: 'btn-sm', title: t('ui.unlink', 'Unlink') }, '✕');
                  un.onclick = (e) => {
                    e.stopPropagation();
                    const j = DB.list(link.m).find(x => x[link.a] === id && x[link.b] === r.id);
                    if (j) { DB.remove(link.m, j.id); renderView(); }
                  };
                  td.appendChild(un);
                  tr.appendChild(td);
                }
                tr.onclick = () => navigate(link.t, { id: r.id, mode: 'view' }, getDisplayName(link.t, r));
                tbody.appendChild(tr);
              });
              relTable.appendChild(tbody);
              linkedCard.appendChild(relTable);
            }
            mount.appendChild(linkedCard);
          });
        }
      } else {
        // --- Edit Mode ---
        const hasItems = LINE_PARENTS.includes(tbl) && OPS.lineItems(tbl, id).length > 0;
        const form = h('form', { class: 'form-grid' });
        formFields(meta).forEach(f => {
          const group = h('div', { class: `form-group ${['textarea', 'text'].includes(f.type) ? 'full-width' : ''}` });
          group.appendChild(h('label', { class: 'form-label' }, [fieldLabel(tbl, f), f.req ? h('span', { class: 'req' }, '*') : '']));
          const input = buildInput(f, record[f.k], form);
          // With line items present the total is theirs to determine, not the form's.
          if (hasItems && f.k === TOTAL_FIELD(tbl) && input.tagName === 'INPUT') {
            input.readOnly = true;
            input.title = t('line_items.total', 'Total:') + ' ' + t('line_items.title', 'Line Items');
            input.style.background = 'var(--surface-hover)';
          }
          group.appendChild(input);
          form.appendChild(group);
        });
        const btnGroup = h('div', { class: 'form-group full-width', style: 'margin-top:16px; display:flex; gap:10px;' });
        btnGroup.appendChild(h('button', { type: 'submit', class: 'btn-primary' }, t('ui.save_changes', 'Save Changes')));
        form.appendChild(btnGroup);
        form.onsubmit = (e) => {
          e.preventDefault();
          const updates = collectForm(tbl, meta, form);
          if (!updates) return;
          DB.update(tbl, id, updates);
          if (LINE_PARENTS.includes(tbl) && OPS.lineItems(tbl, id).length) OPS.recalcDoc(tbl, id);
          releaseLock(tbl, id);
          renderDetailView(tbl, id, 'view');
        };
        detailCard.appendChild(form);
        mount.appendChild(detailCard);
        // The grid is its own editing surface and stays available in edit mode: a document is
        // its header and its items together.
        if (LINE_PARENTS.includes(tbl)) mount.appendChild(lineItemCard(tbl, id, null, form));
      }
    }

    // --- T2.3: Record Creation View ---
    function renderCreateView(tbl, prefill = {}) {
      const title = $('#page-title');
      const actions = $('#page-actions');
      const mount = $('#view-mount');
      mount.innerHTML = '';
      const navItem = NAV_ITEMS.find(n => n.id === tbl);
      const meta = M(tbl);

      title.innerHTML = `
        <button class="icon-btn" id="btn-create-back" title="Back" style="padding:4px">
          ${ICONS.back}
        </button>
        <span>${t('ui.new', 'New')} ${objSingular(tbl)}</span>
      `;
      $('#btn-create-back').onclick = () => navigate(tbl);

      actions.innerHTML = '';
      const cancelBtn = h('button', { class: 'btn-sm' }, 'Cancel');
      cancelBtn.onclick = () => navigate(tbl);
      actions.appendChild(cancelBtn);

      const formCard = h('div', { class: 'detail-card' });
      const form = h('form', { class: 'form-grid' });
      const today = new Date().toISOString().slice(0, 10);
      formFields(meta).forEach(f => {
        const group = h('div', { class: `form-group ${['textarea', 'text'].includes(f.type) ? 'full-width' : ''}` });
        group.appendChild(h('label', { class: 'form-label' }, [fieldLabel(tbl, f), f.req ? h('span', { class: 'req' }, '*') : '']));
        let initial = prefill[f.k] !== undefined ? prefill[f.k]
          : (f.def === 'today' || (f.type === 'date' && f.req) ? today : (f.def ?? ''));
        // New records belong to whoever creates them unless the caller says otherwise.
        if (initial === '' && (f.k === 'owner_id' || f.k === 'assigned_to' || f.k === 'author_id' || f.k === 'uploaded_by') && f.refTbl === 'UserProfile') {
          initial = DB.getUser().id;
        }
        group.appendChild(buildInput(f, initial, form));
        form.appendChild(group);
      });
      const btnGroup = h('div', { class: 'form-group full-width', style: 'margin-top:16px; display:flex; gap:10px;' });
      btnGroup.appendChild(h('button', { type: 'submit', class: 'btn-primary' }, `${t('ui.create', 'Create')} ${objSingular(tbl)}`));
      form.appendChild(btnGroup);
      // P13: documents are entered header-and-items together, not header first.
      const draftItems = [];
      form.onsubmit = (e) => {
        e.preventDefault();
        const data = collectForm(tbl, meta, form);
        if (!data) return;
        Object.assign(data, prefill);
        const orphan = draftItems.findIndex(li => !li.product_id);
        if (orphan > -1) {
          alert(`${t('line_items.title', 'Line Items')} ${(orphan + 1) * 10}: ${t('line_items.product', 'Product')} ${t('form.required_suffix', 'is required.')}`);
          return;
        }
        if (draftItems.length) {
          const sum = draftItems.reduce((a, li) => a + OPS.lineTotal(li), 0);
          if (tbl === 'Opportunity') data.amount = sum; else data.total_amount = sum;
        }
        const created = DB.create(tbl, data);
        draftItems.forEach((li, i) => DB.create('LineItem', {
          parent_type: tbl, parent_id: created.id, item_number: String((i + 1) * 10).padStart(6, '0'),
          product_id: li.product_id, quantity: li.quantity, unit_price: li.unit_price,
          discount_percent: li.discount_percent, total_price: OPS.lineTotal(li), unit_of_measure: li.unit_of_measure
        }));
        navigate(tbl, { id: created.id, mode: 'view' }, getDisplayName(tbl, created));
      };
      formCard.appendChild(form);
      mount.appendChild(formCard);
      if (LINE_PARENTS.includes(tbl)) mount.appendChild(lineItemCard(tbl, null, draftItems));
    }

    // --- Dialog helper (UX-P17) ---
    function openDlg(title, bodyEl, buttons) {
      const dlg = $('#c3dlg');
      dlg.innerHTML = '';
      const head = h('div', { class: 'dlg-head' }, [h('span', {}, title)]);
      const closeX = h('button', { class: 'icon-btn', style: 'padding:2px 8px' }, '✕');
      closeX.onclick = () => dlg.close();
      head.appendChild(closeX);
      dlg.appendChild(head);
      const body = h('div', { class: 'dlg-body' });
      body.appendChild(bodyEl);
      dlg.appendChild(body);
      const foot = h('div', { class: 'dlg-foot' });
      (buttons || []).forEach(b => foot.appendChild(b));
      dlg.appendChild(foot);
      dlg.showModal();
      return dlg;
    }

    // --- PL10: Business operations ---
    const DOC_CHAIN = {
      Opportunity: [{ to: 'Quotation', l: '+ New Quote' }, { to: 'SalesOrder', l: '+ New Order' }],
      Quotation: [{ to: 'SalesOrder', l: '+ New Order' }],
      SalesOrder: [{ to: 'Invoice', l: '+ New Invoice' }]
    };
    const LINE_PARENTS = ['Opportunity', 'Quotation', 'SalesOrder', 'Invoice'];
    const TOTAL_FIELD = (tbl) => (tbl === 'Opportunity' ? 'amount' : 'total_amount');
    const OPS = {
      lineItems(tbl, id) {
        return DB.query('LineItem', { filter: r => r.parent_type === tbl && r.parent_id === id, sortBy: 'item_number' }).data;
      },
      lineTotal(li) {
        const qty = Number(li.quantity) || 0, price = Number(li.unit_price) || 0, disc = Number(li.discount_percent) || 0;
        return Math.round(qty * price * (1 - disc / 100) * 100) / 100;
      },
      recalcDoc(tbl, id) {
        const total = this.lineItems(tbl, id).reduce((sum, li) => sum + this.lineTotal(li), 0);
        if (tbl !== 'Opportunity') DB.update(tbl, id, { total_amount: total });
        else DB.update(tbl, id, { amount: total || DB.getById(tbl, id)?.amount });
        return total;
      },
      addLineItem(tbl, id, data) {
        const count = this.lineItems(tbl, id).length;
        const li = DB.create('LineItem', {
          parent_type: tbl, parent_id: id,
          item_number: String((count + 1) * 10).padStart(6, '0'),
          quantity: 1, unit_price: 0, discount_percent: 0, ...data
        });
        DB.update('LineItem', li.id, { total_price: this.lineTotal(li) });
        this.recalcDoc(tbl, id);
        return li;
      },
      convertLead(leadId, opts) {
        const lead = DB.getById('Lead', leadId);
        if (!lead || lead.status === 'Converted') return null;
        const account = DB.create('Account', {
          name1: (opts.accountName || lead.company || `${lead.first_name} ${lead.last_name}`).slice(0, 40),
          status: 'Active', currency: 'EUR', owner_id: lead.owner_id || DB.getUser().id,
          phone: lead.phone, website: lead.website
        });
        const contact = DB.create('Contact', {
          first_name: lead.first_name, last_name: lead.last_name, email: lead.email,
          phone: lead.phone, mobile: lead.mobile, position: lead.position,
          account_id: account.id, status: 'Active', owner_id: lead.owner_id || DB.getUser().id
        });
        let opp = null;
        if (opts.createOpp) {
          const stages = DB.list('PipelineStage');
          opp = DB.create('Opportunity', {
            name: (opts.oppName || `${account.name1} - New Opportunity`).slice(0, 120),
            account_id: account.id, stage_id: stages[0]?.id, result: 'Open',
            currency: 'EUR', probability: stages[0]?.default_probability || 10,
            owner_id: lead.owner_id || DB.getUser().id
          });
        }
        DB.update('Lead', leadId, {
          status: 'Converted', converted_at: new Date().toISOString(),
          converted_account_id: account.id, converted_contact_id: contact.id,
          converted_opportunity_id: opp ? opp.id : null
        });
        return { account, contact, opp };
      },
      docConvert(srcTbl, srcId, tgtTbl) {
        const src = DB.getById(srcTbl, srcId);
        if (!src) return null;
        const today = new Date().toISOString().slice(0, 10);
        const base = {
          account_id: src.account_id, contact_id: src.contact_id || null,
          currency: src.currency || 'EUR', owner_id: src.owner_id || DB.getUser().id,
          total_amount: src.total_amount || src.amount || 0, status: 'Draft'
        };
        if (srcTbl === 'Opportunity') base.opportunity_id = srcId;
        if (src.opportunity_id) base.opportunity_id = src.opportunity_id;
        if (srcTbl === 'Quotation') base.quotation_id = srcId;
        if (srcTbl === 'SalesOrder') base.sales_order_id = srcId;
        if (tgtTbl === 'Quotation') { base.valid_from = today; base.valid_to = today; }
        if (tgtTbl === 'SalesOrder') base.order_date = today;
        if (tgtTbl === 'Invoice') { base.invoice_date = today; base.due_date = today; }
        const target = DB.create(tgtTbl, base);
        this.lineItems(srcTbl, srcId).forEach((li, i) => {
          DB.create('LineItem', {
            parent_type: tgtTbl, parent_id: target.id,
            item_number: String((i + 1) * 10).padStart(6, '0'),
            product_id: li.product_id, quantity: li.quantity, unit_price: li.unit_price,
            discount_percent: li.discount_percent, total_price: li.total_price,
            unit_of_measure: li.unit_of_measure
          });
        });
        this.recalcDoc(tgtTbl, target.id);
        return target;
      }
    };

    // --- UX-P8: Quick Action Bar ---
    const PARENT_FK = { Account: 'account_id', Contact: 'contact_id', Lead: 'lead_id', Opportunity: 'opportunity_id', Ticket: 'ticket_id' };
    function quickActionBar(tbl, id, record) {
      const bar = h('div', { class: 'quickbar' });
      const fk = PARENT_FK[tbl];
      if (fk) {
        [['Call', t('action.log_call', 'Log Call')], ['Email', t('action.log_email', 'Log Email')],
         ['Meeting', t('action.log_meeting', 'Log Meeting')], ['Task', t('action.new_task', 'New Task')]].forEach(([type, lbl]) => {
          const b = h('button', { class: 'btn-sm' }, lbl);
          b.onclick = () => {
            const prefill = { type, [fk]: id, status: type === 'Task' ? 'Planned' : 'Completed' };
            if (tbl === 'Contact' && record.account_id) prefill.account_id = record.account_id;
            navigate('Activity', { mode: 'create', prefill }, lbl);
          };
          bar.appendChild(b);
        });
      }
      (DOC_CHAIN[tbl] || []).forEach(cv => {
        const b = h('button', { class: 'btn-sm', style: 'border-color:var(--primary); color:var(--primary)' }, cv.l);
        b.onclick = () => {
          const items = OPS.lineItems(tbl, id).length;
          const msg = t('dialog.doc_convert_description', 'This will create a new {target} based on this {source}.')
            .replace('{target}', objLabel(cv.to)).replace('{source}', objLabel(tbl))
            + (items ? ` ${items} ${t('dialog.line_items_copied', 'line items will be copied')}` : '');
          if (!confirm(msg)) return;
          const target = OPS.docConvert(tbl, id, cv.to);
          navigate(cv.to, { id: target.id, mode: 'view' }, getDisplayName(cv.to, target));
        };
        bar.appendChild(b);
      });
      if (tbl === 'Lead') {
        const done = record.status === 'Converted';
        const b = h('button', { class: 'btn-primary btn-sm', disabled: done },
          done ? t('dialog.already_converted', 'Already converted') : t('ui.convert', 'Convert'));
        if (!done) b.onclick = () => leadConvertDialog(record);
        bar.appendChild(b);
      }
      if (tbl === 'Opportunity') {
        const room = DB.list('DealRoom').find(r => r.opportunity_id === id);
        const b = h('button', { class: 'btn-sm' }, room ? 'Open Deal Room' : 'Create Deal Room');
        b.onclick = () => {
          const target = room || DB.create('DealRoom', { name: record.name, opportunity_id: id, status: 'Active', owner_id: DB.getUser().id });
          navigate('DealRoom', { id: target.id, mode: 'view' }, target.name);
        };
        bar.appendChild(b);
      }
      if (tbl === 'Ticket') {
        const b = h('button', { class: 'btn-sm' }, 'Open Case Room');
        b.onclick = () => navigate('CaseRoom', { id, mode: 'view' }, record.subject);
        bar.appendChild(b);
      }
      return bar;
    }

    // --- F3: Lead conversion dialog ---
    function leadConvertDialog(lead) {
      const body = h('div', {});
      body.appendChild(h('p', { style: 'margin:0; font-size:13px; color:var(--text-muted)' },
        t('dialog.convert_description', 'Converting this lead will create the following records:')));
      body.appendChild(h('p', { style: 'margin:6px 0; font-size:13px;' },
        `${t('dialog.contact', 'Contact')}: ${lead.first_name} ${lead.last_name}${lead.email ? ' <' + lead.email + '>' : ''}`));
      const accInput = h('input', { class: 'form-control', value: lead.company || `${lead.first_name} ${lead.last_name}` });
      body.appendChild(h('label', { class: 'form-label' }, t('dialog.account_name', 'Account Name')));
      body.appendChild(accInput);
      const oppCheck = h('input', { type: 'checkbox' });
      const oppWrap = h('label', { style: 'display:flex; align-items:center; gap:8px; font-size:13px;' }, [oppCheck, t('dialog.create_opportunity', 'Create an opportunity')]);
      body.appendChild(oppWrap);
      const oppName = h('input', { class: 'form-control', value: `${lead.company || lead.last_name} - New Opportunity`, style: 'display:none' });
      oppCheck.onchange = () => { oppName.style.display = oppCheck.checked ? '' : 'none'; };
      body.appendChild(oppName);
      const cancel = h('button', {}, t('ui.cancel', 'Cancel'));
      const go = h('button', { class: 'btn-primary' }, t('ui.convert', 'Convert'));

    // --- UX-P10: Inline line item grid ---
    /**
     * P13: one line-item editor for both worlds. With a `draft` array it edits unsaved rows
     * in memory so a quote can be entered header-and-items in one go; without it, it writes
     * through to LineItem records and keeps the document total in step.
     */
    function lineItemCard(tbl, id, draft, syncForm) {
      const isDraft = Array.isArray(draft);
      const card = h('div', { class: 'linked-card' });
      const rerender = () => card.replaceWith(lineItemCard(tbl, id, draft, syncForm));
      // Mirror a recalculated total into an open edit form so the two never disagree.
      const syncTotal = () => {
        if (!syncForm) return;
        const field = syncForm.querySelector(`[name="${TOTAL_FIELD(tbl)}"]`);
        const rec = DB.getById(tbl, id);
        if (field && rec) field.value = rec[TOTAL_FIELD(tbl)] ?? 0;
      };
      const rows = isDraft ? draft : OPS.lineItems(tbl, id);
      const header = h('div', { class: 'linked-header' });
      header.appendChild(h('span', {}, `${t('line_items.title', 'Line Items')} (${rows.length})`));
      const addBtn = h('button', { type: 'button', class: 'btn-sm' }, '+ ' + t('ui.add', 'Add'));
      addBtn.onclick = () => {
        // No product preselected: the row opens empty so the picker can be searched.
        if (isDraft) {
          draft.push({ product_id: null, quantity: 1, unit_price: 0, discount_percent: 0 });
          rerender();
        } else {
          OPS.addLineItem(tbl, id, { product_id: null, unit_price: 0 });
          if (syncForm) { syncTotal(); rerender(); } else renderView();
        }
      };
      header.appendChild(addBtn);
      card.appendChild(header);
      if (!rows.length) {
        card.appendChild(h('div', { style: 'padding:14px; color:var(--text-muted); font-size:13px;' },
          t('dialog.no_line_items', 'No line items to copy')));
        return card;
      }
      const table = h('table', { class: 'data-table li-grid' });
      table.innerHTML = `<thead><tr>
        <th>${t('line_items.item_number', 'Item #')}</th><th>${t('line_items.product', 'Product')}</th>
        <th>${t('line_items.quantity', 'Quantity')}</th><th>${t('line_items.net_price', 'Net Price')}</th>
        <th>${t('line_items.discount', 'Discount %')}</th><th>${t('line_items.net_value', 'Net Value')}</th><th></th>
      </tr></thead>`;
      const tbody = h('tbody');
      const totalEl = h('div', { class: 'li-total' });
      const paintTotal = () => {
        const sum = rows.reduce((a, li) => a + OPS.lineTotal(li), 0);
        totalEl.textContent = `${t('line_items.total', 'Total:')} ${sum.toLocaleString()}`;
      };
      rows.forEach((li, i) => {
        const tr = h('tr');
        tr.appendChild(h('td', {}, isDraft ? String((i + 1) * 10) : DB.formatNumber(li.item_number)));
        const prodPick = refPicker({ k: '_product', refTbl: 'Product' }, li.product_id,
          (p) => p.status !== 'Discontinued',
          (rec) => {
            // Choosing a product adopts its list price; a price typed afterwards stands until
            // the product is changed again.
            if (rec && rec.base_price != null) price.value = rec.base_price;
            save();
          });
        prodPick.style.minWidth = '190px';
        prodPick.querySelector('input.form-control').placeholder = t('line_items.select_product', 'Select product');
        if (!li.product_id) prodPick.classList.add('missing');
        const qty = h('input', { type: 'number', step: 'any', class: 'form-control', value: li.quantity ?? 1, style: 'width:80px' });
        const price = h('input', { type: 'number', step: 'any', class: 'form-control', value: li.unit_price ?? 0, style: 'width:100px' });
        const disc = h('input', { type: 'number', step: 'any', class: 'form-control', value: li.discount_percent ?? 0, style: 'width:70px' });
        const totalCell = h('td', { style: 'font-weight:600; text-align:right;' }, Number(OPS.lineTotal(li)).toLocaleString());
        const save = () => {
          const patch = {
            product_id: prodPick.querySelector('input[type=hidden]').value || null,
            quantity: Number(qty.value) || 0,
            unit_price: Number(price.value) || 0, discount_percent: Number(disc.value) || 0
          };
          patch.total_price = OPS.lineTotal(patch);
          const prod = DB.getById('Product', patch.product_id);
          if (prod) patch.unit_of_measure = prod.unit_of_measure;
          Object.assign(li, patch);
          if (!isDraft) { DB.update('LineItem', li.id, patch); OPS.recalcDoc(tbl, id); syncTotal(); }
          totalCell.textContent = Number(patch.total_price).toLocaleString();
          paintTotal();
        };
        [qty, price, disc].forEach(inp => inp.onchange = save);
        [prodPick, qty, price, disc].forEach(el => tr.appendChild(h('td', {}, el)));
        tr.appendChild(totalCell);
        const del = h('button', { type: 'button', class: 'btn-sm', title: t('ui.remove', 'Remove') });
        del.innerHTML = ICONS.trash;
        del.onclick = () => {
          if (isDraft) { draft.splice(i, 1); rerender(); }
          else {
            DB.remove('LineItem', li.id); OPS.recalcDoc(tbl, id);
            // In edit mode the form must survive; only the grid is rebuilt.
            if (syncForm) { syncTotal(); rerender(); } else renderView();
          }
        };
        tr.appendChild(h('td', {}, del));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      card.appendChild(table);
      paintTotal();
      card.appendChild(totalEl);
      return card;
    }

    // --- PL11: audit trail hook ---
    const AUDITED = new Set(['Account', 'Contact', 'Lead', 'Opportunity', 'Quotation', 'SalesOrder', 'Invoice', 'Product', 'Activity', 'Ticket', 'KnowledgeArticle', 'Asset', 'ServiceContract', 'DealRoom', 'SLA', 'Comment', 'Document']);
    HOOKS.create.push((tbl, r) => { if (AUDITED.has(tbl)) audit('Create', tbl, r); });
    HOOKS.update.push((tbl, r) => { if (AUDITED.has(tbl)) audit('Update', tbl, r); });
    HOOKS.remove.push((tbl, r) => { if (AUDITED.has(tbl)) audit('Delete', tbl, r); });
    function audit(action, tbl, r) {
      const rows = DB.list('AuditLog');
      rows.push({ id: crypto.randomUUID(), action, object_type: tbl, object_id: r.id,
        object_name: getDisplayName(tbl, r).slice(0, 80), user_id: DB.getUser().id,
        timestamp: new Date().toISOString() });
      if (rows.length > 500) rows.splice(0, rows.length - 500);
      DB._setRaw(DB._k('AuditLog'), rows);
    }

    // --- F11: SLA deadline stamping on ticket create ---
    HOOKS.create.push((tbl, r) => {
      if (tbl !== 'Ticket' || r.sla_response_deadline) return;
      const sla = DB.list('SLA').find(x => x.active !== false && x.priority_level === r.priority);
      if (!sla) return;
      const base = new Date(r.created_at || Date.now());
      const stamp = (hrs) => hrs ? new Date(base.getTime() + hrs * 3600000).toISOString() : null;
      DB.update('Ticket', r.id, {
        sla_id: sla.id,
        sla_response_deadline: stamp(sla.response_time_hours),
        sla_resolution_deadline: stamp(sla.resolution_time_hours)
      });
    });
    // Resolution stamps follow ticket status semantics.
    HOOKS.update.push((tbl, r) => {
      if (tbl !== 'Ticket') return;
      const st = DB.getById('TicketStatus', r.status_id);
      if (!st) return;
      const stamps = {};
      if (st.is_resolved && !r.resolved_at) stamps.resolved_at = new Date().toISOString();
      if (st.is_closed && !r.closed_at) stamps.closed_at = new Date().toISOString();
      if (Object.keys(stamps).length) DB.update('Ticket', r.id, stamps);
    });

    function relTime(iso) {
      if (!iso) return '';
      const d = (Date.now() - new Date(iso).getTime()) / 1000;
      if (d < 60) return t('time.now', 'just now');
      if (d < 3600) return `${Math.floor(d / 60)}m`;
      if (d < 86400) return `${Math.floor(d / 3600)}h`;
      return `${Math.floor(d / 86400)}d`;
    }
    function slaChip(deadline, doneAt) {
      if (!deadline) return '';
      const due = new Date(deadline).getTime();
      if (doneAt) return `<span class="chip chip-green sla-chip">✓ ${new Date(doneAt).toISOString().slice(0, 16).replace('T', ' ')}</span>`;
      const left = due - Date.now();
      const abs = Math.abs(left);
      const txt = `${Math.floor(abs / 3600000)}h ${Math.floor((abs % 3600000) / 60000)}m`;
      return left < 0
        ? `<span class="chip chip-red sla-chip">${t('enum.Overdue', 'Overdue')} ${txt}</span>`
        : `<span class="chip ${left < 4 * 3600000 ? 'chip-orange' : 'chip-blue'} sla-chip">${txt}</span>`;
    }

    // --- F25/F51: case-to-article draft (AI-enhanced in Phase 7 when configured) ---
    function draftArticleFromTicket(tk) {
      const resolution = DB.query('Comment', { filter: c => c.parent_type === 'Ticket' && c.parent_id === tk.id }).data
        .map(c => c.content).join('\n');
      const finish = (content) => {
        const art = DB.create('KnowledgeArticle', {
          title: `How to resolve: ${tk.subject}`.slice(0, 255), category: tk.category || 'Support',
          content, status: 'Draft', author_id: DB.getUser().id
        });
        DB.create('TicketKnowledgeArticle', { ticket_id: tk.id, knowledge_article_id: art.id });
        navigate('KnowledgeArticle', { id: art.id, mode: 'view' }, art.title);
      };
      const fallback = `## Problem\n${tk.description || tk.subject}\n\n## Resolution\n${resolution || 'Documented from ticket #' + DB.formatNumber(tk.ticket_number) + '.'}`;
      if (typeof AI !== 'undefined' && AI.ready()) {
        AI.ask(`Write a concise knowledge base article (markdown, ## Problem / ## Resolution sections) from this resolved support ticket.\nSubject: ${tk.subject}\nDescription: ${tk.description || '-'}\nResolution notes: ${resolution || '-'}`)
          .then(finish).catch(() => finish(fallback));
      } else finish(fallback);
    }

    // --- T5.3: pessimistic record locking (15 min TTL, cross-tab) ---
    const LOCK_TTL = 15 * 60 * 1000;
    function lockKey(tbl, id) { return `${tbl}:${id}`; }
    function getLock(tbl, id) {
      const locks = DB._raw(`${PREFIX}locks`) || {};
      const lk = locks[lockKey(tbl, id)];
      if (!lk) return null;
      if (Date.now() - lk.at > LOCK_TTL) { delete locks[lockKey(tbl, id)]; DB._setRaw(`${PREFIX}locks`, locks); return null; }
      return lk;
    }
    function acquireLock(tbl, id) {
      const cur = getLock(tbl, id);
      const me = DB.getUser();
      if (cur && cur.tab !== TAB_ID) return false;
      const locks = DB._raw(`${PREFIX}locks`) || {};
      locks[lockKey(tbl, id)] = { user: me.id, name: me.name, at: Date.now(), tab: TAB_ID };
      DB._setRaw(`${PREFIX}locks`, locks);
      return true;
    }
    function releaseLock(tbl, id) {
      const locks = DB._raw(`${PREFIX}locks`) || {};
      const lk = locks[lockKey(tbl, id)];
      if (lk && lk.tab === TAB_ID) { delete locks[lockKey(tbl, id)]; DB._setRaw(`${PREFIX}locks`, locks); }
    }
    const TAB_ID = crypto.randomUUID();
    window.addEventListener('beforeunload', () => {
      const locks = DB._raw(`${PREFIX}locks`) || {};
      let changed = false;
      for (const [k, lk] of Object.entries(locks)) if (lk.tab === TAB_ID) { delete locks[k]; changed = true; }
      if (changed) DB._setRaw(`${PREFIX}locks`, locks);
    });

    const AI = {
      cfg() { return (DB._raw(`${PREFIX}cfg`) || {}).ai || {}; },
      ready() { return !!this.cfg().key; },
      async ask(prompt, opts = {}) {
        const c = this.cfg();
        if (!c.key) throw new Error('No AI provider configured');
        const sys = opts.system || 'You are the AI assistant inside the CRMTHREE CRM. Be concise and business-focused.';
        const history = opts.history || [];
        if (c.provider === 'Anthropic') {
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-api-key': c.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
            body: JSON.stringify({ model: c.model || 'claude-sonnet-5', max_tokens: 1024, system: sys, messages: [...history, { role: 'user', content: prompt }] })
          });
          if (!res.ok) throw new Error('AI request failed: ' + res.status);
          return (await res.json()).content.map(b => b.text || '').join('');
        }
        if (c.provider === 'Google') {
          const model = c.model || 'gemini-2.5-flash';
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${c.key}`, {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ system_instruction: { parts: [{ text: sys }] },
              contents: [...history.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), { role: 'user', parts: [{ text: prompt }] }] })
          });
          if (!res.ok) throw new Error('AI request failed: ' + res.status);
          const data = await res.json();
          return data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
        }
        // OpenAI wire format (also custom endpoints)
        const res = await fetch((c.endpoint || 'https://api.openai.com') + '/v1/chat/completions', {
          method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + c.key },
          body: JSON.stringify({ model: c.model || 'gpt-4o-mini', messages: [{ role: 'system', content: sys }, ...history, { role: 'user', content: prompt }] })
        });
        if (!res.ok) throw new Error('AI request failed: ' + res.status);
        return (await res.json()).choices?.[0]?.message?.content || '';
      }
    };

    // Read-through: an active external source refreshes its collection when its list opens (D2).
    const _dsFetched = {};
    async function dataSourceRefresh(tbl) {
      const cfg = DB.list('DataSourceConfig').find(x => x.object_type === tbl && x.active);
      if (!cfg || _dsFetched[tbl]) return false;
      _dsFetched[tbl] = true;
      try {
        const res = await fetch(cfg.endpoint_url);
        const rows = await res.json();
        if (Array.isArray(rows)) {
          upsertRows(tbl, rows, cfg.key_field);
          renderView();
        }
      } catch (e) { console.warn('External source fetch failed (CORS?):', e.message); }
    }
    function upsertRows(tbl, rows, keyField) {
      let created = 0, updated = 0, skipped = 0;
      rows.forEach(r => {
        if (typeof r !== 'object' || !r) { skipped++; return; }
        const existing = keyField && r[keyField] != null ? DB.list(tbl).find(x => String(x[keyField]) === String(r[keyField])) : null;
        if (existing) { DB.update(tbl, existing.id, r); updated++; }
        else { DB.create(tbl, r); created++; }
      });
      return { created, updated, skipped, received: rows.length };
    }

    function renderReplicationSettings(body) {
      body.innerHTML = `<p style="font-size:12.5px; color:var(--text-muted); margin:4px 0 10px;">${t('settings.replication.description', 'Replicate data from external web services into CRMThree. Configure a source per object type with field mappings, then run to import records.')} CORS applies (D2).</p>`;
      const list = h('div', {});
      const render = () => {
        list.innerHTML = '';
        DB.list('ReplicationConfig').forEach(cfg => {
          const row = h('div', { class: 'side-kv', style: 'flex-wrap:wrap' });
          row.innerHTML = `<span><b>${cfg.name}</b> → ${objLabel(cfg.object_type)} · <span style="color:var(--text-muted); font-size:11.5px">${cfg.last_run_at ? relTime(cfg.last_run_at) + ' · ' + (cfg.last_result || '') : t('ui.never', 'Never')}</span></span>`;
          const btns = h('span', { style: 'display:flex; gap:6px' });
          const run = h('button', { class: 'btn-primary btn-sm' }, 'Run now');
          run.onclick = async () => {
            run.disabled = true;
            try {
              const res = await fetch(cfg.endpoint_url);
              let rows = await res.json();
              if (!Array.isArray(rows)) rows = rows.items || rows.data || [];
              const map = cfg.field_mapping || {};
              const mapped = rows.map(r => {
                if (!Object.keys(map).length) return r;
                const o = {};
                Object.entries(map).forEach(([ext, loc]) => { if (r[ext] !== undefined) o[loc] = r[ext]; });
                return o;
              });
              const st = upsertRows(cfg.object_type, mapped, cfg.key_field);

    // --- D3/D5: full backup / restore + storage meter ---
    function renderBackupSettings(body) {
      let used = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(PREFIX)) used += k.length + (localStorage.getItem(k) || '').length;
      }
      const quota = 5 * 1024 * 1024;
      const pct = Math.min(100, Math.round(used * 2 / quota * 100)); // UTF-16: 2 bytes per char
      body.innerHTML = `<div style="font-size:13px; margin-bottom:6px;">Storage used: <b>${(used * 2 / 1024).toFixed(0)} KB</b> of ~5 MB</div>
        <div class="lvl-bar" style="margin-bottom:14px"><div style="width:${pct}%; background:${pct > 80 ? 'var(--danger)' : 'var(--primary)'}"></div></div>`;
      const exp = iconBtn('download', 'Export database (JSON)', 'btn-primary btn-sm');
      exp.onclick = () => {
        const dump = { exported_at: new Date().toISOString(), version: 1, data: {} };
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PREFIX)) dump.data[k] = localStorage.getItem(k);
        }
        const blob = new Blob([JSON.stringify(dump)], { type: 'application/json' });
        const a = h('a', { href: URL.createObjectURL(blob), download: `crmthree-plain-backup-${new Date().toISOString().slice(0, 10)}.json` });
        document.body.appendChild(a); a.click(); a.remove();
      };
      const impInput = h('input', { type: 'file', accept: '.json', style: 'display:none' });
      const imp = iconBtn('upload', 'Restore from backup');
      imp.onclick = () => impInput.click();
      impInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const dump = JSON.parse(evt.target.result);
            if (!dump.data) throw new Error('Not a CRMTHREE backup file');
            if (!confirm(`Replace ALL local data with the backup from ${dump.exported_at || '?'}? This cannot be undone.`)) return;
            Object.keys(localStorage).filter(k => k.startsWith(PREFIX)).forEach(k => localStorage.removeItem(k));
            Object.entries(dump.data).forEach(([k, v]) => localStorage.setItem(k, v));
            location.reload();
          } catch (err) { alert('Restore failed: ' + err.message); }
        };
        reader.readAsText(file);
      };
      const reset = iconBtn('warn', 'Reset database', 'btn-danger btn-sm');
      reset.onclick = () => { if (confirm('Reset the local database? All data will be replaced by seed defaults.')) { resetDB(); location.reload(); } };
      body.appendChild(h('div', { style: 'display:flex; gap:8px; flex-wrap:wrap' }, [exp, imp, impInput, reset]));
    }

    function awardXP(uid, eventName, dedupe) {
      if (!uid) return;
      if (dedupe && DB.list('XPLog').some(x => x.dedupe === dedupe)) return;
      const ev = DB.list('XPEvent').find(x => x.event_name === eventName);
      if (!ev) return;
      const prof = DB.getById('UserProfile', uid);
      if (!prof) return;
      const before = levelFor(prof.xp_total || 0);
      DB.create('XPLog', { user_id: uid, event: eventName, xp: ev.xp_value, dedupe: dedupe || null });
      // streak: consecutive days with at least one XP action
      const today = new Date().toISOString().slice(0, 10);
      const last = prof.last_action_date;
      let streak = prof.current_streak || 0;
      if (last !== today) {
        const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        streak = last === y ? streak + 1 : 1;
      }
      const xp = (prof.xp_total || 0) + ev.xp_value;
      DB.update('UserProfile', uid, {
        xp_total: xp, current_streak: streak,
        longest_streak: Math.max(prof.longest_streak || 0, streak),
        last_action_date: today
      });
      const after = levelFor(xp);
      if (after.name !== before.name) {
        notify(uid, t('settings.notifications.level_up', 'Level Up'), `${before.name} → ${after.name}`, null, null, `lvl:${uid}:${after.name}`);
        if (uid === DB.getUser().id) celebrate();
      }
      // badges
      const updated = DB.getById('UserProfile', uid);
      const st = gamiStats(uid);
      BADGES.forEach(b => {
        if (!b.test(st, updated)) return;
        if (DB.list('BadgeAward').some(a => a.user_id === uid && a.badge_key === b.key)) return;
        DB.create('BadgeAward', { user_id: uid, badge_key: b.key, name: b.name, ico: b.ico });
        notify(uid, t('settings.notifications.badge_earned', 'Badge Earned'), b.name, null, null, `badge:${uid}:${b.key}`);
        if (uid === DB.getUser().id) celebrate();
      });

    function hbarChart(rows, fmt) {
      const wrap = h('div', {});
      const max = Math.max(1, ...rows.map(r => r.v));
      rows.forEach(r => {
        const row = h('div', { class: 'hbar-row' });
        row.innerHTML = `<span class="hbar-lbl" title="${r.l}">${r.l}</span>
          <span class="hbar-track"><span class="hbar"><div style="width:${Math.max(r.v / max * 100, r.v ? 2 : 0)}%"></div></span>
          <span class="hbar-val" style="left:calc(${Math.max(r.v / max * 100, r.v ? 2 : 0)} * (100% - 72px) / 100)">${fmt ? fmt(r.v) : r.v}</span></span>`;
        wrap.appendChild(row);
      });
      return wrap;
    }
    const PRIORITY_RAMP = { Low: '#8FA9FA', Medium: '#5A80EF', High: '#2450C4', Critical: '#132466' };
    function donutChart(slices, centerLabel) {
      const total = slices.reduce((a, b) => a + b.v, 0) || 1;
      const R = 44, C = 2 * Math.PI * R;
      let off = 0;
      const segs = slices.filter(sl => sl.v).map(sl => {
        const frac = sl.v / total;
        const seg = `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${sl.c}" stroke-width="18"
          stroke-dasharray="${(frac * C - 2).toFixed(1)} ${(C - frac * C + 2).toFixed(1)}"
          stroke-dashoffset="${(-off * C + C / 4).toFixed(1)}"><title>${sl.l}: ${sl.v}</title></circle>`;
        off += frac;
        return seg;
      }).join('');
      const legend = slices.map(sl => `<div style="display:flex; align-items:center; gap:6px; font-size:12px;">
        <span style="width:10px; height:10px; border-radius:2px; background:${sl.c}; display:inline-block"></span>
        <span style="color:var(--text-muted)">${sl.l}</span><b style="margin-left:auto">${sl.v}</b></div>`).join('');
      const el = h('div', { style: 'display:flex; gap:16px; align-items:center;' });
      el.innerHTML = `<svg viewBox="0 0 120 120" width="120" height="120">${segs}
        <text x="60" y="64" text-anchor="middle" font-size="22" font-weight="800" fill="currentColor">${centerLabel}</text></svg>
        <div style="flex:1; display:flex; flex-direction:column; gap:5px;">${legend}</div>`;
      return el;
    }
    function lineChart(points) {
      const W = 320, H = 96, P = 8;
      const max = Math.max(1, ...points.map(p => p.v));
      const step = (W - 2 * P) / Math.max(1, points.length - 1);
      const xy = points.map((p, i) => [P + i * step, H - P - (p.v / max) * (H - 2 * P)]);
      const path = xy.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
      const dots = xy.map(([x, y], i) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--primary)"><title>${points[i].l}: ${points[i].v}</title></circle>`).join('');
      const labels = points.map((p, i) => `<text x="${(P + i * step).toFixed(1)}" y="${H + 12}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${p.l}</text>`).join('');
      const el = h('div', {});
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H + 18}" style="width:100%; height:auto;">
        <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2"/>${dots}${labels}</svg>`;
      return el;
    }

    function renderCsvImport(body) {
      body.innerHTML = `
        <p style="font-size:12.5px; color:var(--text-muted); margin:4px 0 10px;">${t('settings.import.description', 'Import records from a CSV file into any object type. Select the target object and click Import to begin.')}</p>
