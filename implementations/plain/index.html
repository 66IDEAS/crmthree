          <div class="form-group"><label class="form-label">${t('settings.import.object_type', 'Object Type')}</label>
            <select class="form-control" id="import-target-select">
              ${REG.nav.filter(([id]) => id !== 'CaseRoom' && id !== 'DealRoom').map(([id]) => `<option value="${id}">${objLabel(id)}</option>`).join('')}
            </select></div>
          <div class="form-group"><label class="form-label">${t('ui.choose_file', 'Choose File')}</label>
            <input type="file" id="import-csv-file" accept=".csv" class="form-control"></div>
          <div id="import-preview-area" style="display:none;">
            <div id="import-map-area" style="display:flex; flex-direction:column; gap:6px; margin-bottom:10px;"></div>
            <div id="import-preview-table" style="overflow-x:auto; margin-bottom:12px;"></div>
            <button class="btn-primary" id="btn-run-import">${t('ui.import_csv', 'Import CSV')}</button>
          </div>
          <div id="import-status-msg" style="font-weight:600;"></div>
        </div>`;
      const fileInput = $('#import-csv-file', body);
      const previewArea = $('#import-preview-area', body);
      const mapArea = $('#import-map-area', body);
      const previewTable = $('#import-preview-table', body);
      const statusMsg = $('#import-status-msg', body);
      let rows = [], headers = [], mapping = {};
      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const lines = String(evt.target.result).split(/\r?\n/).filter(l => l.trim().length);
          if (lines.length < 2) { alert(t('dialog.csv_empty', 'CSV file is empty or has no data rows.')); return; }
          const split = (l) => l.match(/("([^"]|"")*"|[^,]*)(,|$)/g).slice(0, -1).map(c => c.replace(/,$/, '').trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
          headers = split(lines[0]);
          rows = lines.slice(1).map(l => { const vals = split(l); const o = {}; headers.forEach((hd, i) => o[hd] = vals[i] ?? ''); return o; });
          const tbl = $('#import-target-select', body).value;
          const meta = M(tbl);
          mapping = {};
          mapArea.innerHTML = `<b style="font-size:12.5px">${t('section.field_mapping', 'Field Mapping')}</b>`;
          headers.forEach(hd => {
            const row = h('div', { style: 'display:flex; gap:8px; align-items:center; font-size:12.5px;' });
            row.appendChild(h('span', { style: 'width:160px; overflow:hidden; text-overflow:ellipsis;' }, hd));
            const sel = h('select', { class: 'form-control', style: 'padding:3px 6px; font-size:12px; flex:1' });
            sel.appendChild(h('option', { value: '' }, '—'));
            formFields(meta).forEach(f => {
              const o = h('option', { value: f.k }, fieldLabel(tbl, f));
              const norm = (x) => x.toLowerCase().replace(/[^a-z0-9]/g, '');
              if (norm(hd) === norm(f.k) || norm(hd) === norm(f.l)) { o.selected = true; mapping[hd] = f.k; }
              sel.appendChild(o);
            });
            sel.onchange = () => { mapping[hd] = sel.value || undefined; };
            row.appendChild(sel);
            mapArea.appendChild(row);
          });
          previewArea.style.display = 'block';
          previewTable.innerHTML = `<table class="data-table" style="font-size:12px;">
            <thead><tr>${headers.map(hd => `<th>${hd}</th>`).join('')}</tr></thead>
            <tbody>${rows.slice(0, 5).map(r => `<tr>${headers.map(hd => `<td>${(r[hd] || '').replace(/</g, '&lt;')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
          statusMsg.textContent = `Ready to import ${rows.length} record(s).`;
        };
        reader.readAsText(file);
      };
      $('#btn-run-import', body).onclick = () => {
        if (!rows.length) return;
        const tbl = $('#import-target-select', body).value;
        let created = 0;
        rows.forEach(r => {
          const rec = {};
          headers.forEach(hd => { if (mapping[hd] && r[hd] !== '') rec[mapping[hd]] = r[hd]; });
          if (Object.keys(rec).length) { DB.create(tbl, rec); created++; }
        });
        statusMsg.innerHTML = `<span style="color:var(--success)">${t('dialog.import_complete', 'Import complete:')} ${created} ${t('dialog.created', 'created')}</span>`;
        rows = []; fileInput.value = ''; previewArea.style.display = 'none';
        bus.emit('db:import');
      };
    }

    // --- Global Search & AI Heuristics (T1.4) ---
    function setupSearch() {
      const input = $('#global-search-input');
      const panel = $('#dropup-panel');
      const content = $('#dropup-content');
      const closeBtn = $('#dropup-close');
      const title = $('#dropup-title');
      if (!input || !panel) return;

      let debounceTimer = null;
      const chatHistory = [];

      function executeSearch(query) {
        if (!query.trim()) {
          panel.classList.remove('open');
          return;
        }

        const isQuestion = /[?]/.test(query) || 
                           /^(who|what|where|why|how|is|can|could|will|should)\b/i.test(query.trim()) ||
                           query.trim().split(/\s+/).length >= 4;

        panel.classList.add('open');
        content.innerHTML = '';

        if (isQuestion) {
          title.textContent = 'AI Assistant';
          const thread = h('div', { style: 'display:flex; flex-direction:column; gap:8px;' });
          const bubble = (text, own) => {
            const b = h('div', { style: own
              ? 'align-self:flex-end; background:var(--primary); color:white; padding:8px 12px; border-radius:8px 8px 0 8px; font-size:13px; max-width:80%; white-space:pre-wrap;'
              : 'align-self:flex-start; background:var(--surface-hover); color:var(--text); padding:8px 12px; border-radius:8px 8px 8px 0; font-size:13px; max-width:80%; white-space:pre-wrap;' }, text);
            thread.appendChild(b);
            content.scrollTop = content.scrollHeight;
            return b;
          };
          chatHistory.forEach(m => bubble(m.content, m.role === 'user'));
          bubble(query, true);
          content.appendChild(thread);
          input.value = '';
          if (!AI.ready()) {
            bubble('No AI provider configured. Add your key under Settings → AI Provider.', false);
          } else {
            const wait = bubble('…', false);
            const context = `Data snapshot: ${DB.list('Account').length} accounts, ${DB.list('Opportunity').length} opportunities (open pipeline €${DB.list('Opportunity').filter(o => (o.result || 'Open') === 'Open').reduce((a, o) => a + Number(o.amount || 0), 0).toLocaleString()}), ${DB.list('Ticket').length} tickets, ${DB.list('Lead').length} leads.`;
            AI.ask(query, { system: 'You are the AI assistant inside the CRMTHREE CRM. ' + context, history: chatHistory.slice(-8) })
              .then(ans => {
                wait.textContent = ans;
                chatHistory.push({ role: 'user', content: query }, { role: 'assistant', content: ans });
              })
              .catch(e => { wait.textContent = e.message; });
          }
        } else {
          title.textContent = `Search Results: "${query}"`;
          const groups = REG.nav.map(([id]) => id).filter(id => id !== 'CaseRoom' && M(id));
          let matchCount = 0;

          groups.forEach(tbl => {
            const results = DB.query(tbl, { search: query, pageSize: 5 }).data;
            if (results.length > 0) {
              matchCount += results.length;
              const grp = h('div', { class: 'search-group' });
              grp.appendChild(h('div', { class: 'search-group-title' }, `${objLabel(tbl)} (${results.length})`));
              results.forEach(r => {
                const name = getDisplayName(tbl, r);
                const item = h('div', { class: 'search-item' }, [
                  h('span', {}, name),
                  h('span', { class: 'chip' }, DB.formatNumber(r.account_number || r.ticket_number || r.opportunity_number || ''))
                ]);
                item.onclick = () => {
                  panel.classList.remove('open');
                  input.value = '';
                  navigate(tbl, { id: r.id, mode: 'view' }, name);
                };
                grp.appendChild(item);
              });
              content.appendChild(grp);
            }
          });

          if (matchCount === 0) {
            content.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted)">No matching records found across collections.</div>`;
          }
        }
      }

      input.oninput = () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => executeSearch(input.value), 250);
      };

      input.onkeydown = (e) => {
        if (e.key === 'Enter') {
          clearTimeout(debounceTimer);
          executeSearch(input.value);
        } else if (e.key === 'Escape') {
          panel.classList.remove('open');
        }
      };

      closeBtn.onclick = () => panel.classList.remove('open');

      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          input.focus();
          input.select();
        } else if (e.key === 'Escape') {
          panel.classList.remove('open');
          $('#notif-menu')?.classList.remove('open');
          $('#user-menu')?.classList.remove('open');
        }
      });
    }

    // --- UI Shell Events ---
    function setupShellEvents() {
      const ribbon = $('#left-ribbon');
      const ribbonToggle = $('#ribbon-toggle');
      const backdrop = $('#ribbon-backdrop');
      if (ribbonToggle && ribbon) {
        ribbonToggle.onclick = () => {
          if (window.innerWidth <= 768) {
            ribbon.classList.toggle('mobile-open');
            backdrop?.classList.toggle('mobile-open');
          } else {
            state.ribbonExpanded = !state.ribbonExpanded;
            ribbon.classList.toggle('expanded', state.ribbonExpanded);
          }
        };
      }
      if (backdrop) {
        backdrop.onclick = () => {
          ribbon?.classList.remove('mobile-open');
          backdrop.classList.remove('mobile-open');
        };
      }

      $('#topbar-home-btn').onclick = () => navigate('home');
      [['menu-item-profile', 'user'], ['menu-item-timeline', 'clock'], ['menu-item-team-timeline', 'team'],
       ['menu-item-theme', 'theme'], ['menu-item-signout', 'signout'], ['menu-item-reset', 'warn']]
        .forEach(([id, icon]) => { const el = $('#' + id + ' .mi'); if (el) el.innerHTML = ICONS[icon]; });
      $('#topbar-burger').onclick = () => {
        $('#left-ribbon').classList.toggle('mobile-open');
        $('#ribbon-backdrop').classList.toggle('mobile-open');
      };

      const notifBtn = $('#notif-btn');
      const notifMenu = $('#notif-menu');
      if (notifBtn && notifMenu) {
        notifBtn.onclick = (e) => {
          e.stopPropagation();
          $('#user-menu')?.classList.remove('open');
          renderNotifMenu();
          notifMenu.classList.toggle('open');
        };
      }

      const userBtn = $('#user-avatar-btn');
      const userMenu = $('#user-menu');
      if (userBtn && userMenu) {
        userBtn.onclick = (e) => {
          e.stopPropagation();
          $('#notif-menu')?.classList.remove('open');
          userMenu.classList.toggle('open');
        };
      }

      window.addEventListener('click', (e) => {
        if (!e.target.closest('#notif-menu') && !e.target.closest('#notif-btn')) {
          $('#notif-menu')?.classList.remove('open');
        }
        if (!e.target.closest('#user-menu') && !e.target.closest('#user-avatar-btn')) {
          $('#user-menu')?.classList.remove('open');
        }
      });

      $('#menu-item-theme').onclick = () => { toggleTheme(); $('#user-menu').classList.remove('open'); };
      $('#menu-item-profile').onclick = () => { navigate('Profile', {}, t('profile.title', 'Profile')); $('#user-menu').classList.remove('open'); };
      $('#menu-item-signout').onclick = () => { navigate('login', {}, t('ui.sign_out', 'Sign Out')); $('#user-menu').classList.remove('open'); };
      $('#menu-item-timeline').onclick = () => { navigate('MyTimeline', {}, 'My Timeline'); $('#user-menu').classList.remove('open'); };
      $('#menu-item-team-timeline').onclick = () => { navigate('TeamTimeline', {}, 'Team Timeline'); $('#user-menu').classList.remove('open'); };
      $('#menu-item-reset').onclick = () => {
        if (confirm('Are you sure you want to reset the localStorage database? All sample records and configurations will be reset.')) {
          resetDB();
          location.reload();
        }
      };

      $('#gamification-widget').onclick = () => navigate('Leaderboard', {}, 'Leaderboard');
    }

    function resetDB() {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(PREFIX)) keys.push(k);
      }
      keys.forEach(k => localStorage.removeItem(k));
      seedDefaults(true);
      applyLanguage();
      bus.emit('db:reset');
    }

    // Expose programmatic API on window.CRM
    window.CRM = {
      DB,
      OPS,
      AI,
      notify,
      awardXP,
      bus,
      $,
      $$,
      h,
      state,
      navigate,
      setTheme,
      toggleTheme,
      seedDefaults,
      resetDB,
      exportCSV,
      M,
      REG,
      t,
      setLanguage,
      getDisplayName
    };

    // --- Bootstrap Execution ---
    (async () => {
      seedDefaults();
      await inflatePacks().catch(() => {});
      applyLanguage();
      const savedCfg = DB._raw(`${PREFIX}cfg`) || {};
      if (savedCfg.theme) setTheme(savedCfg.theme);
      setupShellEvents();
      setupSearch();
      updateTopbar();
      renderBreadcrumbs();
      renderRibbon();
      renderView();
    })();

  })();
  </script>
</body>
</html>
