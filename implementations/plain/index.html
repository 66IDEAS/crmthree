  <style>
    /* --- T1.1: Micro CSS System & Design Tokens --- */
    :root {
      --bg: #F8F9FA;
      --surface: #FFFFFF;
      --surface-hover: #F3F4F6;
      --border: #E5E7EB;
      --text: #111827;
      --text-muted: #6B7280;
      --primary: #2E62E8;
      --primary-hover: #1E4FC2;
      --accent: #F7941D; /* C3 Orange */
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --top-h: 56px;
      --bot-h: 48px;
      --rib-w: 56px;
      --rib-exp-w: 210px;
    }
    [data-theme="dark"] {
      --bg: #121418;
      --surface: #1E2229;
      --surface-hover: #262B34;
      --border: #2D333F;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --primary: #487DF8;
      --primary-hover: #2E62E8;
      --accent: #F7941D;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--primary); text-decoration: none; cursor: pointer; }
    a:hover { text-decoration: underline; }
    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 13px;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: var(--surface-hover); }
    button.btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-danger {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    button.btn-sm { padding: 4px 8px; font-size: 12px; }

    /* Layout Shell */
    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* The bottom AI bar is fixed; reserving its height here keeps it from covering the
         rail's pinned Settings item on short viewports. */
      padding-bottom: var(--bot-h);
    }

    /* --- T1.2: Top Bar --- */
    .topbar {
      height: var(--top-h);
      background: var(--surface);
      border-bottom: 3px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 30;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .logo-mark {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text);
      user-select: none;
    }
    .logo-mark span { color: var(--accent); }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .gamification-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .gamification-bar:hover { background: var(--surface-hover); }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background: var(--surface-hover);
      border: 1px solid var(--border);
    }
    .chip-accent { background: rgba(247, 148, 29, 0.15); color: var(--accent); border-color: transparent; }
    .chip-green { background: rgba(16, 185, 129, 0.15); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.25); }
    .chip-red { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.25); }
    .chip-orange { background: rgba(245, 158, 11, 0.15); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.25); }
    .chip-blue { background: rgba(46, 98, 232, 0.15); color: #2E62E8; border: 1px solid rgba(46, 98, 232, 0.25); }
    .chip-gray { background: var(--surface-hover); color: var(--text-muted); border: 1px solid var(--border); }
    .icon-btn {
      background: none;
      border: none;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      position: relative;
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
    .badge-count {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-weight: bold;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    /* Body Shell (Ribbon + Content) */
    .body-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* --- T1.3: Collapsible Left Ribbon Navigation --- */
    .ribbon {
      width: var(--rib-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.18s ease-in-out;
      z-index: 25;
      overflow: hidden;
    }
    .ribbon.expanded {
      width: var(--rib-exp-w);
    }
    .ribbon-hamburger {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      color: var(--accent);
      user-select: none;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }
    .ribbon-hamburger svg {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: block;
    }
    .ribbon-nav {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 8px 0;
      gap: 2px;
      overflow-y: auto;
      overflow-x: hidden;
      /* macOS "always show scrollbars" renders a bar wide enough to sit on the icons. */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .ribbon-nav::-webkit-scrollbar { width: 0; height: 0; display: none; }
    .logo-mark .logo-svg { height: 20px; width: auto; display: block; }
    .popover-item .mi { display: inline-flex; width: 16px; color: var(--text-muted); }
    .popover-item svg { width: 15px; height: 15px; }
    /* P11: type-ahead reference picker */
    .ref-pick { position: relative; }
    /* Rendered into <body> at a fixed position: cards, tables and the scrolling content area
       all clip their overflow, and a dropdown must never be cut off by them. */
    .ref-drop { position: fixed; z-index: 200; max-height: 260px; overflow-y: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); display: none; }
    .ref-drop.open { display: block; }
    .ref-opt { padding: 7px 10px; font-size: 13px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
    .ref-opt:hover, .ref-opt.sel { background: var(--surface-hover); }
    .ref-opt .n { color: var(--text-muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .ref-empty { padding: 10px; font-size: 12.5px; color: var(--text-muted); }
    .ref-drop { min-width: 240px; }
    .ref-pick.missing input.form-control { border-color: var(--danger); }
    .ref-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); font-size: 14px; line-height: 1; padding: 2px 4px; }
    /* P15: rendered markdown */
    .md { font-size: 13px; line-height: 1.55; }
    .md h1, .md h2, .md h3 { margin: 0.6em 0 0.3em; line-height: 1.25; }
    .md h1 { font-size: 1.35em; } .md h2 { font-size: 1.18em; } .md h3 { font-size: 1.05em; }
    .md p { margin: 0.5em 0; } .md ul, .md ol { margin: 0.4em 0; padding-left: 1.3em; }
    .md code { background: var(--surface-hover); padding: 1px 4px; border-radius: 3px; font-size: 0.92em; }
    .md pre { background: var(--surface-hover); padding: 10px; border-radius: 6px; overflow-x: auto; }
    .md pre code { background: none; padding: 0; }
    .md blockquote { margin: 0.5em 0; padding-left: 10px; border-left: 3px solid var(--border); color: var(--text-muted); }
    .md a { color: var(--primary); }
    .ribbon-item {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 42px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background 0.1s, color 0.1s;
      font-size: 13.5px;
      border-left: 3px solid transparent;
      overflow: hidden;
    }
    .ribbon-item svg {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: block;
    }
    .ribbon-label {
      display: none;
      margin-left: 14px;
      white-space: nowrap;
    }
    .ribbon.expanded .ribbon-label {
      display: inline;
    }
    .ribbon-item:hover {
      background: var(--surface-hover);
      color: var(--text);
    }
    .ribbon-item.active {
      color: var(--primary);
      background: var(--surface-hover);
      border-left-color: var(--accent);
      font-weight: 600;
    }
    .ribbon-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 12px;
    }
    .ribbon-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 24;
    }

    /* --- T1.5 & Phase 2: Main Content Area & Sticky Headers --- */
    .main-viewport {
      flex: 1;
      overflow-y: auto;
      background: var(--bg);
      padding: 16px 24px calc(var(--bot-h) + 24px) 24px;
      display: flex;
      flex-direction: column;
    }
    .breadcrumbs {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .breadcrumbs span.current { color: var(--text); font-weight: 600; }
    .sticky-header {
      position: sticky;
      top: -16px;
      background: var(--bg);
      padding: 8px 0 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    #page-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; white-space: nowrap; }
    .view-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* --- Phase 2: Tables & Data Grids (T2.1) --- */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .table-toolbar {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    .data-table th {
      background: var(--surface-hover);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .data-table th:hover { color: var(--text); }
    .data-table td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .data-table tbody tr {
      cursor: pointer;
      transition: background 0.1s;
    }
    .data-table tbody tr:hover {
      background: var(--surface-hover);
    }
    .pagination-bar {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text-muted);
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 8px;
    }
    .pagination-btns { display: flex; align-items: center; gap: 6px; }

    /* --- Phase 2: Details & Progressive Disclosure Card (T2.2 & T2.3) --- */
    .detail-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .field-item { display: flex; flex-direction: column; gap: 4px; }
    .field-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .field-val { font-size: 13.5px; color: var(--text); word-break: break-word; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full-width { grid-column: 1 / -1; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text); display: flex; gap: 4px; }
    .form-label .req { color: var(--danger); font-weight: bold; }
    .form-control {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(46, 98, 232, 0.15);
    }
    textarea.form-control { resize: vertical; min-height: 80px; }

    /* --- Phase 2: Linked Records Cards (T2.4) --- */
    .linked-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 20px;
      overflow: hidden;
    }
    .linked-header {
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 14px;
    }

    /* --- T1.4: Persistent Bottom AI & Search Bar --- */
    .bottom-bar {
      height: var(--bot-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 40;
    }
    .ask-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }
    .search-input-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-input {
      width: 100%;
      height: 34px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 34px 0 12px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(46, 98, 232, 0.15);
    }
    .search-shortcut {
      position: absolute;
      right: 10px;
      font-size: 10.5px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 3px;
      pointer-events: none;
    }
    .dropup-panel {
      position: fixed;
      bottom: var(--bot-h);
      left: 16px;
      right: 16px;
      max-width: 800px;
      margin: 0 auto;
      max-height: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.12);
      display: none;
      flex-direction: column;
      z-index: 45;
      overflow: hidden;
    }
    .dropup-panel.open { display: flex; }
    .dropup-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
    }
    .dropup-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }
    .search-group { margin-bottom: 12px; }
    .search-group-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .search-item {
      padding: 6px 10px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 13px;
    }
    .search-item:hover { background: var(--surface-hover); }

    /* Popover Panels (Notifications & User Profile) */
    .popover-menu {
      position: fixed;
      top: calc(var(--top-h) + 4px);
      right: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      width: 280px;
      display: none;
      flex-direction: column;
      z-index: 50;
      overflow: hidden;
    }
    .popover-menu.open { display: flex; }
    .popover-item {
      padding: 10px 14px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: var(--text);
    }
    .popover-item:hover { background: var(--surface-hover); }
    .popover-divider { height: 1px; background: var(--border); margin: 4px 0; }

    /* Responsive Mobile Rules (< 768px) */
    @media (max-width: 768px) {
      .topbar-gamification { display: none !important; }
      .ask-label { display: none !important; }
      .ribbon {
        position: fixed;
        top: var(--top-h);
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        box-shadow: 4px 0 16px rgba(0,0,0,0.2);
        z-index: 60;
        width: var(--rib-exp-w) !important;
      }
      .ribbon.mobile-open { transform: translateX(0); }
      .ribbon .ribbon-label { display: inline !important; }
      .ribbon-backdrop.mobile-open { display: block; }
      .main-viewport { padding: 12px 14px calc(var(--bot-h) + 16px) 14px; }
      .table-toolbar { flex-direction: column; align-items: stretch; }
    }

    /* Phase 3: dialogs, quick actions, line items */
    dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); padding: 0; max-width: 520px; width: 92vw; }
    dialog::backdrop { background: rgba(15, 18, 25, 0.45); backdrop-filter: blur(2px); }
    .dlg-head { padding: 14px 18px; font-weight: 700; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .dlg-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
    .dlg-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
    .quickbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .li-grid input, .li-grid select { padding: 4px 6px; font-size: 12.5px; }
    .li-grid td { padding: 5px 8px; }
    .li-total { text-align: right; font-weight: 700; padding: 10px 12px; }
    @media (max-width: 768px) { dialog { width: 100vw; height: 100dvh; max-width: none; border-radius: 0; } }

    /* Phase 4: workspaces, stepper, comments, timeline */
    .room-grid { display: grid; grid-template-columns: 65fr 35fr; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .room-grid { grid-template-columns: 1fr; } }
    .stepper { display: flex; gap: 4px; margin: 14px 0; overflow-x: auto; padding-bottom: 4px; }
    .step { flex: 1; min-width: 90px; text-align: center; font-size: 11.5px; padding: 8px 4px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; color: var(--text-muted); white-space: nowrap; }
    .step.done { border-color: var(--success); color: var(--success); }
    .step.now { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
    .step.lost { background: var(--danger); border-color: var(--danger); color: #fff; }
    .feed-item { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; align-items: baseline; }
    .feed-item:last-child { border-bottom: none; }
    .feed-time { color: var(--text-muted); font-size: 11.5px; white-space: nowrap; }
    .comment-item { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .comment-item:last-child { border-bottom: none; }
    .comment-head { font-size: 11.5px; color: var(--text-muted); margin-bottom: 3px; }
    .comment-head b { color: var(--text); }
    .comment-form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
    .side-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; }
    .side-card h4 { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .side-kv { display: flex; justify-content: space-between; padding: 6px 14px; font-size: 13px; }
    .side-kv span:first-child { color: var(--text-muted); }
    .sla-chip { font-variant-numeric: tabular-nums; }
    .filter-chips { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-chips .chip { cursor: pointer; }
    .filter-chips .chip.on { background: var(--primary); color: #fff; }

    /* Phase 5: settings accordions, lock banner, login */
    details.acc { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
    details.acc > summary { cursor: pointer; padding: 12px 16px; font-weight: 700; font-size: 13.5px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    details.acc > summary::after { content: '▸'; color: var(--text-muted); transition: transform 0.15s; }
    details.acc[open] > summary::after { transform: rotate(90deg); }
    details.acc > .acc-body { padding: 4px 16px 16px 16px; border-top: 1px solid var(--border); }
    .lock-note { color: var(--warning); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
    .login-wrap { max-width: 380px; margin: 8vh auto; }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
    .profile-pick { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
    .profile-pick:hover { background: var(--surface-hover); }
    .notif-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .notif-item.unread { background: color-mix(in srgb, var(--primary) 6%, transparent); }
    .notif-item:hover { background: var(--surface-hover); }

    /* Phase 6: dashboard, charts, gamification */
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .kpi .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--primary); }
    .kpi .l { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .chart-card h4 { margin: 0 0 12px 0; font-size: 13px; }
    .hbar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; }
    .hbar-lbl { width: 105px; text-align: right; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hbar-track { flex: 1; position: relative; height: 18px; }
    .hbar { position: absolute; inset: 0 72px 0 0; }
    .hbar > div { height: 100%; background: var(--primary); border-radius: 0 3px 3px 0; }
    .hbar-val { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding-left: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .lvl-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .lvl-bar > div { height: 100%; background: var(--accent); }
    .trophy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .trophy { border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .trophy.locked { opacity: 0.45; filter: grayscale(1); }
    .trophy .ico { font-size: 26px; }
    .trophy .nm { font-size: 12px; font-weight: 700; margin-top: 4px; }
    .medal { font-size: 16px; }
    @keyframes confetti-fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0.2; } }
    .confetti { position: fixed; top: 0; width: 10px; height: 14px; z-index: 999; pointer-events: none; animation: confetti-fall 2.5s ease-in forwards; }
    .mobile-burger { display: none; }
    @media (max-width: 768px) {
      #view-mount .data-table th:nth-child(n+4), #view-mount .data-table td:nth-child(n+4) { display: none; }
      .mobile-burger { display: inline-flex; }
    }
  </style>
</head>

  <script>
  (function() {
    'use strict';

    // --- T0.2: Golfed DOM Helpers ---
    const $ = (s, el = document) => el.querySelector(s);
    const $$ = (s, el = document) => [...el.querySelectorAll(s)];
    const h = (tag, attrs = {}, children = []) => {
      const elem = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k.startsWith('on') && typeof v === 'function') {
          elem.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (k === 'style' && typeof v === 'object') {
          Object.assign(elem.style, v);
        } else if (k === 'class' || k === 'className') {
          elem.className = v;
        } else if (v !== false && v !== null && v !== undefined) {
          elem.setAttribute(k, v === true ? '' : v);
        }
      }
      for (const child of (Array.isArray(children) ? children : [children])) {
        if (child === null || child === undefined) continue;
        elem.appendChild(typeof child === 'string' || typeof child === 'number' ? document.createTextNode(child) : child);
      }
      return elem;
    };

    // Pub/Sub Bus
    const bus = {
      subs: {},
      on(evt, fn) { (this.subs[evt] = this.subs[evt] || []).push(fn); },
      emit(evt, data) { (this.subs[evt] || []).forEach(fn => fn(data)); }
    };

    // --- T0.3 & T0.4: Database Engine ---
    const PREFIX = 'c3.';
    // Save-path hooks (PL10/PL11): audit, SLA stamps, notifications, gamification all run
    // here so every entry path (UI, window.CRM, CSV import, replication) behaves the same.
    const HOOKS = { create: [], update: [], remove: [] };
    let hooksSilent = 0;
    function runHooks(op, tbl, record, prev) {
      if (hooksSilent) return;
      hooksSilent++;
      try { HOOKS[op].forEach(fn => { try { fn(tbl, record, prev) } catch (e) { console.warn('hook', e) } }); }
      finally { hooksSilent--; }
    }

    const DB = {
      _k(tbl) { return `${PREFIX}tbl.${tbl}`; },
      _raw(k) {
        try { return JSON.parse(localStorage.getItem(k) || 'null'); }
        catch(e) { return null; }
      },
      _setRaw(k, val) {
        localStorage.setItem(k, JSON.stringify(val));
      },
      nextSeq(tbl) {
        const seqs = this._raw(`${PREFIX}seq`) || {};
        const next = (seqs[tbl] || 0) + 1;
        seqs[tbl] = next;
        this._setRaw(`${PREFIX}seq`, seqs);
        const meta = AUTONUM_FIELDS[tbl];
        return String(next).padStart(meta ? meta.len : 10, '0');
      },
      formatNumber(val) {
        if (!val) return '';
        if (/^\d+$/.test(val)) return String(parseInt(val, 10));
        return String(val);
      },
      getUser() {
        return this._raw(`${PREFIX}auth`) || { id: 'usr_admin', name: 'Alex Ilg', role: 'Admin', email: 'admin@example.com' };
      },
      setUser(user) {
        this._setRaw(`${PREFIX}auth`, user);
        bus.emit('auth:change', user);
      },
      list(tbl) { return this._raw(this._k(tbl)) || []; },
      getById(tbl, id) { return this.list(tbl).find(r => r.id === id) || null; },
      create(tbl, data) {
        const rows = this.list(tbl);
        const now = new Date().toISOString();
        const user = this.getUser();
        const record = {
          id: data.id || (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : 'id_' + Math.random().toString(36).slice(2, 11)),
          ...data,
          created_at: data.created_at || now,
          updated_at: now,
          created_by: data.created_by || user.id,
          updated_by: user.id
        };
        const numMeta = AUTONUM_FIELDS[tbl];
        if (numMeta && !record[numMeta.field]) {
          record[numMeta.field] = this.nextSeq(tbl);
        }
        rows.push(record);
        this._setRaw(this._k(tbl), rows);
        runHooks('create', tbl, record);
        bus.emit(`db:${tbl}`, { op: 'create', record });
        return record;
      },
      update(tbl, id, data) {
        const rows = this.list(tbl);
        const idx = rows.findIndex(r => r.id === id);
        if (idx === -1) return null;
        const now = new Date().toISOString();
        const user = this.getUser();
        const updated = { ...rows[idx], ...data, updated_at: now, updated_by: user.id };
        rows[idx] = updated;
        this._setRaw(this._k(tbl), rows);
        runHooks('update', tbl, updated);
        bus.emit(`db:${tbl}`, { op: 'update', record: updated });
        return updated;
      },
      remove(tbl, id) {
        let rows = this.list(tbl);
        const gone = rows.find(r => r.id === id);
        rows = rows.filter(r => r.id !== id);
        this._setRaw(this._k(tbl), rows);
        if (gone) runHooks('remove', tbl, gone);
        bus.emit(`db:${tbl}`, { op: 'delete', id });
        return true;
      },
      query(tbl, opts = {}) {
        let data = [...this.list(tbl)];
        if (opts.search) {
          const q = opts.search.toLowerCase().trim();
          data = data.filter(row => Object.values(row).some(v => v !== null && v !== undefined && String(v).toLowerCase().includes(q)));
        }
        if (typeof opts.filter === 'function') data = data.filter(opts.filter);
        const sortBy = opts.sortBy;
        const sortDir = (opts.sortDir || 'asc').toLowerCase() === 'desc' ? -1 : 1;
        if (sortBy) {
          data.sort((a, b) => {
            const vA = a[sortBy] ?? '';
            const vB = b[sortBy] ?? '';
            if (typeof vA === 'number' && typeof vB === 'number') return (vA - vB) * sortDir;
            return String(vA).localeCompare(String(vB), undefined, { numeric: true, sensitivity: 'base' }) * sortDir;
          });
        }
        const totalCount = data.length;
        const page = Math.max(1, parseInt(opts.page || 1, 10));
        const pageSize = Math.max(1, parseInt(opts.pageSize || 25, 10));
        const totalPages = Math.ceil(totalCount / pageSize) || 1;
        const pagedData = data.slice((page - 1) * pageSize, page * pageSize);
        return { data: pagedData, totalCount, page, pageSize, totalPages };

    const _meta = {};
    function M(tbl) {
      if (_meta[tbl]) return _meta[tbl];
      const src = REG.o[tbl === 'CaseRoom' ? 'Ticket' : tbl];
      if (!src) return null;
      const fields = src.f.map(f => ({
        k: f.k, l: f.l, type: f.t || 'string', req: !!f.q, auto: !!f.a, len: f.len,
        opts: f.o, refTbl: f.r, def: f.d
      }));
      const byK = Object.fromEntries(fields.map(f => [f.k, f]));
      const cols = src.c.map(k => {
        const f = byK[k] || { k, l: k.split('_').map(w => w[0].toUpperCase() + w.slice(1)).join(' '), type: 'string' };
        return { k, l: f.l, type: f.type, refTbl: f.refTbl, chip: f.type === 'enum' || !!(f.refTbl && ['TicketStatus', 'PipelineStage'].includes(f.refTbl)) };
      });
      return _meta[tbl] = { numField: src.n, fields, cols, linked: (src.x || []).map(x => ({ ...x })), byK };

    function objSingular(tbl) { return tbl.replace(/([a-z0-9])([A-Z])/g, '$1 $2'); }

    function getDisplayName(tbl, r) {
      if (!r) return '';

    /**
     * P15: a compact markdown renderer for long-text fields (knowledge articles above all).
     * Input is escaped first, so only the markup below can produce HTML.
     */
    function mdToHtml(src) {
      const esc = String(src).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const code = [];
      let text = esc.replace(/```([\s\S]*?)```/g, (m, c) => `\u0000${code.push(`<pre><code>${c.replace(/^\n/, '')}</code></pre>`) - 1}\u0000`)
        .replace(/`([^`\n]+)`/g, (m, c) => `\u0000${code.push(`<code>${c}</code>`) - 1}\u0000`);
      const lines = text.split(/\r?\n/);
      const out = [];
      let list = null, para = [];
      const flushPara = () => { if (para.length) { out.push(`<p>${para.join(' ')}</p>`); para = []; } };
      const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
      for (const raw of lines) {
        const line = raw.trimEnd();
        const head = line.match(/^(#{1,6})\s+(.*)$/);
        const uli = line.match(/^\s*[-*+]\s+(.*)$/);
        const oli = line.match(/^\s*\d+[.)]\s+(.*)$/);
        const quote = line.match(/^>\s?(.*)$/);
        if (!line.trim()) { flushPara(); closeList(); continue; }
        if (head) { flushPara(); closeList(); const lvl = Math.min(3, head[1].length); out.push(`<h${lvl}>${head[2]}</h${lvl}>`); continue; }
        if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flushPara(); closeList(); out.push('<hr>'); continue; }
        if (uli || oli) {
          flushPara();
          const want = uli ? 'ul' : 'ol';
          if (list !== want) { closeList(); out.push(`<${want}>`); list = want; }
          out.push(`<li>${(uli || oli)[1]}</li>`);
          continue;
        }
        if (quote) { flushPara(); closeList(); out.push(`<blockquote>${quote[1]}</blockquote>`); continue; }
        closeList();
        para.push(line.trim());
      }
      flushPara(); closeList();
      let html = out.join('');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
        .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
        .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return html.replace(/\u0000(\d+)\u0000/g, (m, i) => code[+i]);
    }
